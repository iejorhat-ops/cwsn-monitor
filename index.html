<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe4ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>IE Monitoring System</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;font-size:15px;margin:0;background:#fff;color:#000}
h2{font-size:20px;margin:10px 0}
h3{font-size:17px;margin:18px 0 6px;border-bottom:2px solid #ff8000;padding-bottom:3px}
#hdr{background:#ffe4ec;border-bottom:3px solid #ff8000;padding:8px 12px}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logoimg{height:60px;width:auto;max-width:190px;background:#fff;border:1px solid #ff8000}
.logo{width:46px;height:46px;background:#ff8000;color:#fff;font-weight:bold;font-size:20px;text-align:center;line-height:46px;border:2px solid #b34700}
.ht{flex:1;min-width:200px;font-size:16px}
.sub{font-size:13px}
.hu{font-size:13px;text-align:right}
#tabs{padding:6px 8px 0 8px;border-bottom:1px solid #ff8000}
.tab{font-family:Arial;font-size:14px;background:#fff;color:#000;border:1px solid #ff8000;padding:8px 12px;margin:0 2px 0 0;cursor:pointer;border-radius:0}
.tab.on{background:#ffe4ec;font-weight:bold;border-bottom:3px solid #ff8000}
#tabs:empty,#subtabs:empty{display:none}
#subtabs{padding:6px 8px 0 8px;border-bottom:1px solid #ff8000;background:#fff}
.secbtn{font-size:16px;font-weight:bold;padding:10px 18px;background:#fff}
.secbtn.on{background:#ff9933;border-bottom:3px solid #b34700}
.subbtn{font-size:14px;padding:9px 14px}
.tiles .opt{display:block;max-width:520px;margin:6px 0;padding:14px;font-size:16px}
#main{padding:10px 12px;max-width:1300px;margin:0 auto}
#foot:empty{display:none}
#foot{border-top:3px solid #ff8000;background:#ffe4ec;padding:8px 12px;font-size:12px;margin-top:20px}
.btn{font-family:Arial;font-size:15px;padding:9px 16px;border:1px solid #000;color:#000;background:#ff9933;cursor:pointer;border-radius:0;margin:2px}
.btn.g{background:#008000;color:#fff}
.btn.o{background:#ffc2d4;color:#000}
.btn.sm{padding:3px 8px;font-size:13px}
.btn.big{font-size:18px;padding:12px 24px}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=password],input[type=url],textarea,select{width:100%;max-width:520px;padding:8px;font-size:16px;font-family:Arial;border:1px solid #666;background:#fff;border-radius:0;color:#000}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=password],input[type=url],textarea{-webkit-appearance:none;appearance:none}
input[type=radio],input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin:0 4px 0 0}
.fld{margin:12px 0}
.fld .t{display:block;font-weight:bold;margin-bottom:4px}
.opt{display:inline-block;margin:2px 8px 2px 0;padding:6px 10px;border:1px solid #999;background:#fff;cursor:pointer}
.hint{font-size:12px;color:#333}
.err{border:2px solid #cc0000;background:#ffe0e0;padding:8px;margin:8px 0}
.okmsg{border:2px solid #008000;background:#e0ffe0;padding:8px;margin:8px 0}
.warn{border:2px solid #ff8000;background:#fff0d9;padding:8px;margin:8px 0}
.info{border:1px solid #ff8000;background:#fff5f8;padding:8px;margin:8px 0}
.note{color:#333;font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.stat{border:1px solid #ff8000;background:#fff;padding:8px;min-width:140px;flex:1}
.stat .n{font-size:24px;font-weight:bold;color:#e65c00}
.stat .lb{font-size:13px}
.stat .nt{font-size:11px;color:#333}
.stat.bad .n{color:#cc0000}
.filters{border:1px solid #ff8000;background:#fff5f8;padding:8px;margin:8px 0}
.fgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.fgrid>div{flex:1;min-width:130px}
.fgrid label{font-size:12px;font-weight:bold;display:block}
.fgrid select,.fgrid input{max-width:none}
.chip{display:inline-block;border:1px solid #ff8000;padding:5px 11px;margin:3px 3px 0 0;background:#fff;cursor:pointer;font-size:13px}
.chip.on{background:#ff9933;color:#000;font-weight:bold}
.scroll{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{border:1px solid #000;padding:4px 6px;text-align:left;vertical-align:top;background:#fff}
.tbl th{background:#ffe4ec}
.tbl tr:nth-child(even) td{background:#fff5f8}
.tbl tr.flag td{background:#ffc9c0}
.tbl tr.tot td{background:#ffe4ec;font-weight:bold}
.cards{display:none}
.card{border:1px solid #000;padding:6px 8px;margin:6px 0;background:#fff;font-size:14px}
.card:nth-child(even){background:#fff5f8}
.card.flag{background:#ffc9c0}
.ok{color:#008000;font-weight:bold}
.bad{color:#cc0000;font-weight:bold}
.bar{background:#ffe4ec;height:14px;border:1px solid #ff8000;min-width:80px}
.bar i{display:block;height:100%;background:#ff9933}
.count{font-size:13px;margin:6px 0}
.thumbs img{width:90px;height:90px;object-fit:cover;border:1px solid #000;margin:3px}
.thumbs .th{display:inline-block;position:relative}
.thumbs .th button{position:absolute;top:3px;right:3px;background:#ffc2d4;border:1px solid #000;font-size:12px;padding:0 5px;border-radius:0}
#ov{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;overflow:auto;padding:10px;z-index:9}
#ov img{max-width:100%;border:1px solid #000;margin:6px 0;display:block}
.geo{border:1px solid #ff8000;background:#fff5f8;padding:8px;margin:8px 0;font-size:14px}
.geo.good{background:#e0ffe0;border-color:#008000}
.geo.bad{background:#ffe0e0;border-color:#cc0000}
.pinbox{border:3px solid #ff8000;background:#fff0d9;padding:10px;margin:10px 0}
.pinbox .pin{font-family:Courier New,monospace;font-size:20px;font-weight:bold}
#ov video{width:100%;max-width:640px;border:1px solid #000;background:#eee}
.printonly{display:none}
#busy{display:none;position:fixed;top:0;left:0;right:0;z-index:30;pointer-events:none}
#busy .bb{margin:0 auto;max-width:560px;background:#fff0d9;border:2px solid #ff8000;border-top:0;padding:10px 12px;font-size:16px;font-weight:bold;text-align:center;color:#000}
#busy.blk{bottom:0;pointer-events:auto;background:rgba(255,255,255,.7)}
#busy.blk .bb{margin-top:28vh;border:2px solid #ff8000;padding:18px 14px}
#busy .sm{display:block;font-size:13px;font-weight:normal;margin-top:4px}
.glass{display:inline-block;font-size:22px;vertical-align:middle;animation:glassturn 1.6s steps(2,end) infinite}
@keyframes glassturn{0%{transform:rotate(0deg)}100%{transform:rotate(180deg)}}
@media (max-width:760px){
 .tbl-wrap{display:none}
 .cards{display:block}
 .hu{text-align:left}
 .stat{min-width:45%}
 body{padding-bottom:72px}
 #main{padding:8px 10px}
 #hdr{padding:6px 10px}
 .logoimg{height:42px}
 .ht{min-width:0;font-size:15px}
 .ht .sub{display:none}
 .hu{width:100%}
 #tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;padding:0;background:#ffe4ec;border-top:3px solid #ff8000;border-bottom:0}
 .secbtn{flex:1;margin:0;padding:14px 2px;padding-bottom:calc(14px + env(safe-area-inset-bottom));font-size:15px;text-align:center}
 #subtabs{display:flex;overflow-x:auto;white-space:nowrap;padding:6px}
 .subbtn{flex:none;padding:12px 14px;font-size:15px;margin:0 4px 4px 0}
 .btn{padding:12px 16px;font-size:16px}
 .btn.sm{padding:9px 12px;font-size:14px}
 .btn.big{width:100%;font-size:18px;padding:14px 10px}
 input[type=text],input[type=tel],input[type=number],input[type=date],input[type=month],input[type=password],textarea,select{padding:12px;max-width:none}
 input[type=radio],input[type=checkbox]{width:24px;height:24px}
 .opt{display:block;margin:6px 8px 6px 0;padding:12px}
 h2{font-size:19px}
 .fgrid>div{min-width:45%}
}
@media print{
 #hdr,#tabs,#subtabs,#busy,#banner,.filters,.noprint,#foot,.cards,.act,#msg{display:none!important}
 .printonly{display:block!important}
 .tbl-wrap{display:block!important}
 body{font-size:11px}
 .tbl{font-size:10px}
 .tbl tr:nth-child(even) td{background:#fff}
}
</style>
</head>

<div id="banner"></div>
<div id="main"></div>

<div id="foot"></div>
<div id="busy"></div>

function busyStart(msg,blk){var id=++BUSYID;BUSYQ.push({id:id,msg:msg,blk:blk,t:Date.now()});if(blk)busyDraw();else setTimeout(busyDraw,450);if(!BUSYTMR)BUSYTMR=setInterval(busyDraw,1000);return id}
function busyEnd(id){BUSYQ=BUSYQ.filter(function(b){return b.id!==id});busyDraw();if(!BUSYQ.length&&BUSYTMR){clearInterval(BUSYTMR);BUSYTMR=null}}
function busyDraw(){
  var el=$('busy');if(!el)return;
  var now=Date.now(),vis=BUSYQ.filter(function(b){return b.blk||now-b.t>=400});
  if(!vis.length){el.style.display='none';el.className='';el.innerHTML='';return}
  var b=vis[vis.length-1],blk=vis.some(function(x){return x.blk}),sec=Math.round((now-b.t)/1000);
  var sub=sec>=15?'The server is slow today. Still working - please do not close this page.':(sec>=4?'Please wait ('+sec+' s). Do not close this page.':'');
  el.className=blk?'blk':'';el.style.display='block';
  el.innerHTML='<div class="bb"><span class="glass">&#8987;</span> '+esc(b.msg)+(sub?'<span class="sm">'+esc(sub)+'</span>':'')+'</div>';
}
function htmlSnippet(tx){return String(tx).replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim().slice(0,150)}
function api(action,payload,tryNo){
  tryNo=tryNo||0;
  if(!S.url)return Promise.reject(new Error('No server'));
  var ctrl=window.AbortController?new AbortController():null;
  var t=setTimeout(function(){if(ctrl)ctrl.abort()},90000);
  var bid=busyStart(BUSYMSG[action]||'Working...',!BUSYREAD[action]);
  var status=0;
  return fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:action,token:S.token||'',dev:DEV,ctx:ctx(),payload:payload||{}}),signal:ctrl?ctrl.signal:undefined})
  .then(function(r){clearTimeout(t);status=r.status;return r.text()})
  .then(function(tx){
    var j;try{j=JSON.parse(tx)}catch(x){var e=new Error('The server did not answer properly (code '+status+'). '+(htmlSnippet(tx)?'Message from Google: '+htmlSnippet(tx)+'. ':'')+'Please try again. If it keeps happening, tell the District Office.');e.html=true;throw e}
    if(!j.ok){var e2=new Error(j.error||'Server error');e2.server=true;e2.auth=!!j.auth;if(e2.auth&&action!=='login')endSession(e2.message);throw e2}
    return j;
  })
  .then(function(j){busyEnd(bid);return j},function(e){
    busyEnd(bid);clearTimeout(t);
    if(e&&e.html&&tryNo<2&&BUSYREAD[action]&&action!=='logout')return new Promise(function(res){setTimeout(res,1800)}).then(function(){return api(action,payload,tryNo+1)});
    throw e;
  });
}
function norm(r){
  var o={};KEYS.forEach(function(k){o[k]=r[k]==null?'':r[k]});
  ['operatingDays','present','domains','photoLinks','photoHashes'].forEach(function(k){var v=r[k];o[k]=Array.isArray(v)?v:(v?String(v).split(' | '):[])});
  ['daysFunctioned','cwsn','therapistDays','dailyHonorarium','totalHonorarium','contingency','sessions'].forEach(function(k){o[k]=num(r[k])});
  ['capturedAt','lat','lng','gpsAcc','distanceM'].forEach(function(k){o[k]=(r[k]===''||r[k]==null)?'':Number(r[k])});
  o.weekEnding=String(o.weekEnding).slice(0,10);o.phone=String(o.phone||'');o.status=o.status||'Pending';
  o.photoCount=o.photoLinks.length||num(r.photoCount);o.localPhotos=!!r.localPhotos;o._pending=!!r._pending;
  return o;
}

function shrink(f){return new Promise(function(res,rej){
  var img=new Image(),u=URL.createObjectURL(f);
  img.onload=function(){
    var m=1280,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    var x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
    var t=new Date(),fs=Math.max(14,Math.round(c.width/40));
    x.fillStyle='rgba(255,255,255,0.85)';x.fillRect(0,c.height-fs-10,c.width,fs+10);
    x.fillStyle='#000';x.font='bold '+fs+'px Arial';x.fillText(t.toLocaleDateString('en-GB')+' '+t.toLocaleTimeString('en-GB'),8,c.height-7);
    URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.7));
  };
  img.onerror=function(){rej(new Error('bad image'))};img.src=u;
})}

function buildCtx(all){
  var c={cm:{},cmon:{},dup:{}};
  all.forEach(function(r){
    var ck=r.block+'|'+r.centre,m=r.weekEnding.slice(0,7);
    c.cm[ck+'|'+m]=(c.cm[ck+'|'+m]||0)+r.contingency;
    if(r.contingency>0){c.cmon[ck]=c.cmon[ck]||{};c.cmon[ck][m]=1}
    c.dup[ck+'|'+r.weekEnding]=(c.dup[ck+'|'+r.weekEnding]||0)+1;
  });
  return c;
}
function flagsOf(r,c){
  var f=[],dc=isDC(r.mode),ck=r.block+'|'+r.centre,m=r.weekEnding.slice(0,7);
  if(dc&&r.daysFunctioned<MIN_DAYS)f.push('Under 3 days/week');
  if(dc&&(r.cwsn<MIN_CWSN||r.dailyMinMet==='No'))f.push('Under 10 CWSN/day');
  if(r.dailyHonorarium>CAP_DAY)f.push('Honorarium above Rs. 1,500/day');
  if(r.iepOk==='No')f.push('IEP not updated');
  if(r.registerOk==='No')f.push('Attendance register not maintained');
  if(r.preAssessment!=='Yes')f.push('No prior assessment');
  if(!(r.photoCount>0))f.push('No photo uploaded');
  if(r.contingency>0&&c.cm[ck+'|'+m]>CAP_CONT)f.push('Contingency above Rs. 500 this month');
  if(r.contingency>0&&c.cmon[ck]&&Object.keys(c.cmon[ck]).length>MAX_CONT_MONTHS)f.push('Contingency beyond 10 months');
  if(c.dup[ck+'|'+r.weekEnding]>1)f.push('Duplicate entry (same centre and week)');
  return f;
}
function scope(){var a=REC.filter(function(r){return r.status!=='Rejected'});return S.block?a.filter(function(r){return r.block===S.block}):a}
function prep(){var all=scope(),c=buildCtx(all);all.forEach(function(r){r._f=flagsOf(r,c);r._s=r.secFlags?String(r.secFlags).split(' ; '):[]});return all}
function byDate(a,b){return a.weekEnding<b.weekEnding?1:a.weekEnding>b.weekEnding?-1:(a.timestamp<b.timestamp?1:-1)}
function filt(all,base){
  var q=F.q.toLowerCase();
  return all.filter(function(r){
    if(F.block&&r.block!==F.block)return false;
    if(F.mode&&modeShort(r.mode)!==F.mode)return false;
    if(F.from&&r.weekEnding<F.from)return false;
    if(F.to&&r.weekEnding>F.to)return false;
    if(base)return true;
    if(F.status&&r.status!==F.status)return false;
    if(F.sample&&F.sample.indexOf(r.id)<0)return false;
    var ch=F.chip;
    if(ch==='flagged'&&!r._f.length&&!r._s.length)return false;
    if(ch==='ok'&&(r._f.length||r._s.length))return false;
    if(ch==='sec'&&!r._s.length)return false;
    if((ch==='Day Care'||ch==='BRR'||ch==='HBE')&&modeShort(r.mode)!==ch)return false;
    if(ch==='Pending'&&r.status!=='Pending')return false;
    if(ch==='Returned'&&r.status!=='Returned')return false;
    if(q&&(r.centre+' '+r.block+' '+r.therapist+' '+r.personName+' '+r.centreCode+' '+r.submittedBy).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
function zeroCentres(base){

function importCentres(inp){
  var f=inp.files[0];if(!f)return;
  if(typeof XLSX==='undefined')return alert('Excel library could not load. Connect to the internet and reload.');
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(rd.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}),n=0;
      rows.forEach(function(r){
        var g=function(k){for(var x in r){if(x.trim().toLowerCase()===k)return String(r[x]).trim()}return ''};

        if(CFG.centres.some(function(x){return x.block===b&&x.name.toLowerCase()===nm.toLowerCase()}))return;
        var ce={block:b,mode:normMode(g('mode')),name:nm,code:g('code'),assigned:parseIe(g('ie mobile')||g('ie official mobile')||g('assigned'))};var la=parseFloat(g('latitude')),lo=parseFloat(g('longitude')),ra=parseFloat(g('radius'));if(isFinite(la)&&isFinite(lo)){ce.lat=la;ce.lng=lo}if(isFinite(ra))ce.radius=ra;CFG.centres.push(ce);n++;
      });
      saveCfg();pushCfg(n+' centres imported.').then(function(){showTab('setup')});
    }catch(e){alert('Could not read the file.')}
  };

// ---------- GEO (live location) ----------
function haversine(a,b,c,d){var R=6371000,p=Math.PI/180,x=Math.sin((c-a)*p/2),y=Math.sin((d-b)*p/2),h=x*x+Math.cos(a*p)*Math.cos(c*p)*y*y;return 2*R*Math.asin(Math.sqrt(h))}
function setFix(p){GEO.fix={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,ts:Date.now()};GEO.err=''}
function geoErr(e){GEO.err=e.code===1?'Location permission is blocked. Allow location for this site in the browser settings, then reload.':(e.code===3?'Timed out waiting for GPS. Go outdoors and try again.':'Cannot read location ('+(e.message||'error')+').')}
function startGeo(){
  if(GEO.watch!==null)return;
  if(!navigator.geolocation){GEO.err='This device does not support location.';return}
  GEO.watch=navigator.geolocation.watchPosition(function(p){setFix(p);geoUi()},function(e){geoErr(e);geoUi()},{enableHighAccuracy:true,maximumAge:0,timeout:30000});
}
function stopGeo(){if(GEO.watch!==null&&navigator.geolocation)navigator.geolocation.clearWatch(GEO.watch);GEO.watch=null}
function freshFix(){return new Promise(function(res,rej){
  if(!navigator.geolocation)return rej(new Error('This device does not support location.'));
  if(GEO.watch!==null&&GEO.fix&&Date.now()-GEO.fix.ts<=15000&&GEO.fix.acc<=MAX_ACC){return res(GEO.fix)}
  navigator.geolocation.getCurrentPosition(function(p){setFix(p);geoUi();res(GEO.fix)},function(e){geoErr(e);geoUi();rej(new Error(GEO.err))},{enableHighAccuracy:true,maximumAge:0,timeout:25000});
})}
function refreshGeo(){freshFix().catch(function(){})}
function geoUi(){
  var b=$('geo_box');if(!b||!secure())return;
  var f=GEO.fix,cls='geo',t='';
  if(GEO.err){cls+=' bad';t='<b>Location problem:</b> '+esc(GEO.err)}
  else if(!f){t='Waiting for GPS... Please allow location access when the phone asks.'}
  else{
    t='<b>Your location:</b> '+f.lat.toFixed(5)+', '+f.lng.toFixed(5)+' (accuracy +-'+Math.round(f.acc)+' m)';
    if(f.acc>MAX_ACC){cls+=' bad';t+='<br>Signal too weak (needs under '+MAX_ACC+' m). Go outdoors.'}
    else if(TAB==='entry'){
      var bl=$('e_blk'),ce=$('e_ctr'),m=rv('e_mode');
      if(bl&&ce&&m&&ce.value&&ce.value!=='__new'){
        var c=findCentre(bl.value,ce.value);
        if(m.indexOf('Home')>-1)t+='<br>Home-based visit: location is recorded, no distance limit.';
        else if(c&&c.lat){var d=Math.round(haversine(f.lat,f.lng,c.lat,c.lng)),rad=c.radius||CFG.radius||150;
          if(d-Math.min(f.acc,50)<=rad){cls+=' good';t+='<br>'+d+' m from the centre. Inside the allowed '+rad+' m.'}else{cls+=' bad';t+='<br>'+d+' m from the centre. You must be within '+rad+' m to submit.'}}
        else t+='<br>This centre has no saved location yet (ask the BEEO or District Office). The entry will be flagged.';
      }
    }
    else if(TAB==='daily'&&typeof dGeoNote==='function'){var dn=dGeoNote(f);cls+=dn.cls;t+=dn.t}
  }
  b.className=cls;b.innerHTML=t+' <button class="btn sm" onclick="refreshGeo()">Refresh location</button>';
}

var CAM={stream:null};
function openCam(){
  if(PH.length>=5)return alert('Maximum 5 photos per entry.');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return alert('This browser cannot open the camera. Use Chrome or Safari on the secure (https) link.');
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false}).then(function(s){
    CAM.stream=s;var o=$('ov');o.style.display='block';
    o.innerHTML='<video id="cam_v" autoplay playsinline muted></video><div style="margin:8px 0"><button class="btn g big" onclick="snap()">Capture photo</button> <button class="btn o big" onclick="closeCam()">Done</button></div><div id="cam_m" class="note">Point the camera at the therapy session and tap Capture. Photos taken: '+PH.length+'</div>';
    $('cam_v').srcObject=s;
  }).catch(function(){alert('Camera permission is needed to take photos. Allow camera access for this site and try again.')});
}
function closeCam(){if(CAM.stream){CAM.stream.getTracks().forEach(function(t){t.stop()});CAM.stream=null}var o=$('ov');o.style.display='none';o.innerHTML='';drawPh()}
function dHash(src){var c=document.createElement('canvas');c.width=9;c.height=8;var x=c.getContext('2d');x.drawImage(src,0,0,9,8);var d=x.getImageData(0,0,9,8).data,g=[];for(var i=0;i<72;i++)g.push(d[i*4]*0.3+d[i*4+1]*0.59+d[i*4+2]*0.11);var bits='';for(var y=0;y<8;y++)for(var k=0;k<8;k++)bits+=g[y*9+k]>g[y*9+k+1]?'1':'0';var h='';for(var j=0;j<64;j+=4)h+=parseInt(bits.substr(j,4),2).toString(16);return h}
function sha256(dataUrl){var b=atob(dataUrl.split(',')[1]),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return crypto.subtle.digest('SHA-256',u).then(function(h){return [].slice.call(new Uint8Array(h)).map(function(x){return ('0'+x.toString(16)).slice(-2)}).join('')})}
function snap(){
  var v=$('cam_v'),m=$('cam_m');if(!v||!v.videoWidth)return;
  m.textContent='Reading GPS...';
  freshFix().then(function(f){
    if(f.acc>MAX_ACC)throw new Error('GPS accuracy is '+Math.round(f.acc)+' m. Move outdoors and wait for a better signal.');
    var s=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');
    c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);
    var x=c.getContext('2d');x.drawImage(v,0,0,c.width,c.height);
    var ce=camCheck(f);if(ce)throw new Error(ce);
    var dh=dHash(c),t=new Date(),fs=Math.max(14,Math.round(c.width/38));
    var l1=t.toLocaleDateString('en-GB')+' '+t.toLocaleTimeString('en-GB')+'   '+S.name,l2=f.lat.toFixed(5)+', '+f.lng.toFixed(5)+' (+-'+Math.round(f.acc)+'m)   '+camLabel();
    x.fillStyle='rgba(255,255,255,0.88)';x.fillRect(0,c.height-2*fs-14,c.width,2*fs+14);
    x.fillStyle='#000';x.font='bold '+fs+'px Arial';x.fillText(l1,8,c.height-fs-8);x.fillText(l2,8,c.height-6);
    var data=c.toDataURL('image/jpeg',0.7);
    return sha256(data).then(function(sha){
      PH.push({data:data,sha:sha,dh:dh,lat:f.lat,lng:f.lng,acc:f.acc,ts:Date.now()});drawPh();
      m.textContent='Photo '+PH.length+' saved.';if(PH.length>=5)closeCam();
    });
  }).catch(function(e){m.textContent=e.message||'Could not capture'});
}

PURP[A_SCH]=['Identification / screening of CWSN','Assessment','IEP preparation / review','Teacher / school orientation','Aids, appliances & accessibility','Follow-up of enrolled CWSN','Other'];

var DREC=load('cwsn_drec',[]),DOUT=load('cwsn_dout',[]),MREC=load('cwsn_mrec',[]),SCH=load('cwsn_sch',[]),STAFF=[];

function saveDrec(){save('cwsn_drec',DREC.map(function(r){var o={};for(var k in r){if(k.charAt(0)!=='_')o[k]=r[k]}o._pending=!!r._pending;return o}))}
function saveDout(){save('cwsn_dout',DOUT)}
function duid(){return 'D'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function normD(r){
  var o={};
  ['timestamp','id','date','block','userId','officialName','designation','type','refCode','refName','place','child','purpose','notes','status','verifiedBy','verifiedAt','remark','deviceId','secFlags'].forEach(function(k){o[k]=r[k]==null?'':String(r[k])});
  o.date=o.date.slice(0,10);o.status=o.status||'Pending';
  ['photoLinks','photoHashes','photoGeo'].forEach(function(k){var v=r[k];o[k]=Array.isArray(v)?v:(v?String(v).split(' | '):[])});
  o.cwsn=num(r.cwsn);o.hours=num(r.hours);
  ['capturedAt','lat','lng','gpsAcc','distanceM'].forEach(function(k){o[k]=(r[k]===''||r[k]==null)?'':Number(r[k])});
  o.photoCount=o.photoLinks.length||num(r.photoCount);o.localPhotos=!!r.localPhotos;o._pending=!!r._pending;
  return o;
}
function refreshExtra(light){
  if(!S.url)return Promise.resolve();
  var ps=[
    api('dlist').then(function(j){var keep=DREC.filter(function(r){return r._pending||r.status==='Rejected'});DREC=j.rows.map(normD).concat(keep);saveDrec()}),
    api('mlist').then(function(j){MREC=j.rows;save('cwsn_mrec',MREC)}),
    ];
  if(!light)ps.push(api('schools').then(function(j){SCH=j.rows;save('cwsn_sch',SCH)}));
  if(S.role!=='field')ps.push(api('staff').then(function(j){STAFF=j.rows}));
  return Promise.all(ps.map(function(p){return p.catch(function(e){if(e.auth)throw e})}));
}

// when a person opens an activity / monthly / alerts tab, pull the latest data in the background
function softRefresh(t){
  if(!S.url||!NEWTAB||['dlog','dreview','dall','monthly','security','dash'].indexOf(t)<0)return;
  refreshExtra(true).then(function(){

// ---------- background upload of daily activities ----------
function syncDaily(){
  if(!S.url||!S.token||!DOUT.length||DSYNC)return Promise.resolve();
  DSYNC=true;var sent=0,rej=0,failMsg='';
  return DOUT.slice().reduce(function(p,id){return p.then(function(){
    if(failMsg)return;
    var r=DREC.filter(function(x){return x.id===id})[0];
    if(!r){DOUT=DOUT.filter(function(i){return i!==id});return}
    return idbGet(id).then(function(ph){
      var rec={};['id','date','block','type','refCode','refName','place','child','purpose','cwsn','hours','notes'].forEach(function(k){rec[k]=r[k]});
      var sec={lat:r.lat,lng:r.lng,acc:r.gpsAcc,fixTs:r.capturedAt,capturedAt:r.capturedAt};
      return api('dsubmit',{record:rec,sec:sec,offline:(Date.now()-num(r.capturedAt))>120000,photos:(ph||[]).map(function(p,i){return {name:(r.date+'_'+ACTSHORT[r.type]+'_'+(i+1)).replace(/[^A-Za-z0-9_-]+/g,'_')+'.jpg',mime:'image/jpeg',data:p.data.split(',')[1],sha:p.sha,dh:p.dh,lat:p.lat,lng:p.lng,acc:p.acc,ts:p.ts}})});
    }).then(function(j){
      var n=normD(j.record);DREC=DREC.map(function(x){return x.id===id?n:x});DOUT=DOUT.filter(function(i){return i!==id});idbDel(id);sent++;
    }).catch(function(e){
      if(e.server&&!e.auth){r.status='Rejected';r.remark=e.message;r._pending=false;DOUT=DOUT.filter(function(i){return i!==id});rej++}
      else failMsg=e.message||'network';
    });
  })},Promise.resolve()).then(function(){
    DSYNC=false;saveDrec();saveDout();banner();
    if(sent)flash('Uploaded '+sent+' daily activit'+(sent>1?'ies':'y')+' to the district server.');
    if(rej)flash(rej+' daily activit'+(rej>1?'ies were':'y was')+' REJECTED by the server. Open My Activity Log to see the reason.','err');
    if((sent||rej)&&RESFN)drawRes();
  });
}

function hasLoc(t){return t&&t.lat!==''&&t.lat!=null&&isFinite(t.lat)}
function dGeoNote(f){
  var ty=rv('d_type'),t=dSel();
  if(!ty)return {cls:'',t:''};
  if(ty===A_HOME||ty===A_OTH)return {cls:'',t:'<br>The location is recorded with each photo. No distance limit for this activity.'};

function submitDaily(){
  var er=[],date=$('d_date').value,type=rv('d_type');
  if(!date)er.push('Select the date.');else if(date>today())er.push('The date cannot be in the future.');else if(date<daysAgo(7))er.push('Activities older than 7 days cannot be added.');
  if(!type)er.push('Choose what you did.');
  var f={refCode:'',refName:'',place:'',child:'',purpose:'',cwsn:0,hours:0,notes:''};
  if(type){
    f.purpose=$('d_purp').value;if(!f.purpose)er.push(type===A_OTH?'Select the type of work.':'Select the purpose.');
    f.hours=num($('d_hrs').value);if(f.hours<0||f.hours>16)er.push('Hours spent must be between 0 and 16.');
    f.notes=$('d_notes').value.trim();
    if(type===A_SCH){
      var v=$('d_sch').value;
      if(!v)er.push('Select the school.');
      else if(v==='__other'){f.refName=$('d_sname').value.trim();if(f.refName.length<3)er.push('Type the school name.')}
      else{var sc=SCH.filter(function(x){return x.udise===v})[0];if(sc){f.refCode=sc.udise;f.refName=sc.name}}
    }
    if(type===A_HOME){f.child=$('d_child').value.trim();f.place=$('d_place').value.trim();if(f.child.length<2)er.push('Enter the child name / ID.');if(f.place.length<2)er.push('Enter the village / locality.')}
    if(type===A_CTR){var cn=$('d_ctr').value;if(!cn)er.push('Select the centre.');else{var c=findCentre(S.block,cn);f.refName=cn;f.refCode=c?String(c.code||''):''}}
    if(type===A_SCH||type===A_CTR){var cwv=$('d_cw').value;if(cwv===''||isNaN(parseInt(cwv,10))||parseInt(cwv,10)<0)er.push('Enter the number of CWSN.');else f.cwsn=parseInt(cwv,10)}
    if(type===A_OTH&&f.notes.length<10)er.push('Describe the work done (at least 10 characters).');
    if(type!==A_OTH&&!PH.length)er.push('Take at least one live photo.');
    var tg=dSel();
    if(secure()&&hasLoc(tg))PH.forEach(function(p,i){var d=Math.round(haversine(p.lat,p.lng,tg.lat,tg.lng));if(d-Math.min(p.acc,50)>tg.rad)er.push('Photo '+(i+1)+' was taken about '+d+' m from the '+tg.kind+' (allowed '+tg.rad+' m). Remove it and photograph at the '+tg.kind+'.')});
  }
  if(er.length){$('errs').innerHTML='<div class="err"><b>Please correct:</b><br>- '+er.map(esc).join('<br>- ')+'</div>';window.scrollTo(0,0);return}
  $('errs').innerHTML='';
  var build=function(fix){
    var rec={timestamp:new Date().toISOString(),id:duid(),date:date,block:S.block,userId:S.id||'',officialName:S.name,designation:S.designation||'',type:type,refCode:f.refCode,refName:f.refName,place:f.place,child:f.child,purpose:f.purpose,cwsn:f.cwsn,hours:f.hours,notes:f.notes,photoLinks:[],status:'Pending',verifiedBy:'',verifiedAt:'',remark:'',photoHashes:[],photoGeo:[],secFlags:'',photoCount:PH.length,localPhotos:!S.url,
      capturedAt:fix?fix.ts:'',lat:fix?fix.lat:'',lng:fix?fix.lng:'',gpsAcc:fix?Math.round(fix.acc):'',distanceM:'',deviceId:secure()?DEV:''};
    var n=normD(rec);
    $('d_go').disabled=true;
    idbSet(rec.id,PH.slice()).catch(function(){}).then(function(){
      if(!S.url){DREC.push(n);saveDrec();showTab('daily');flash('Activity saved on this device (demo mode).');return}
      n._pending=true;DREC.push(n);DOUT.push(rec.id);saveDrec();saveDout();banner();showTab('daily');
      flash('Activity saved. Uploading to the district server...');syncDaily();
    });
  };
  if(!secure())return build(null);
  $('d_go').disabled=true;
  freshFix().then(function(fix){
    if(fix.acc>MAX_ACC){$('d_go').disabled=false;$('errs').innerHTML='<div class="err"><b>Cannot save:</b><br>GPS accuracy is '+Math.round(fix.acc)+' m (needs under '+MAX_ACC+' m). Go outdoors and wait for a better signal.</div>';window.scrollTo(0,0);return}
    build(fix);
  }).catch(function(e){$('d_go').disabled=false;$('errs').innerHTML='<div class="err"><b>Cannot save:</b><br>'+esc(e.message||'Location unavailable')+'</div>';window.scrollTo(0,0)});
}

// ---------- ACTIVITY LISTS (own log / block review / district) ----------
function dMine(r){return secure()?r.userId===S.id:true}
function dScope(kind){
  var a=DREC.filter(function(r){return kind==='dlog'?dMine(r):r.status!=='Rejected'});
  if(S.block&&kind!=='dlog')a=a.filter(function(r){return r.block===S.block});
  return a;
}
function dFilter(a){
  var q=D.q.toLowerCase();
  return a.filter(function(r){
    if(D.month&&r.date.slice(0,7)!==D.month)return false;
    if(D.type&&r.type!==D.type)return false;
    if(D.user&&r.userId!==D.user)return false;
    if(D.block&&r.block!==D.block)return false;
    if(D.status&&r.status!==D.status)return false;
    if(q&&(r.officialName+' '+r.refName+' '+r.child+' '+r.place+' '+r.purpose+' '+r.notes+' '+r.block+' '+r.type).toLowerCase().indexOf(q)<0)return false;
    return true;
  }).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.timestamp<b.timestamp?1:-1)});
}
function dWhat(r){
  if(r.type===A_SCH)return esc(r.refName)+(r.refCode?'<br><span class="note">UDISE '+esc(r.refCode)+'</span>':'');
  if(r.type===A_HOME)return esc(r.child)+'<br><span class="note">'+esc(r.place)+'</span>';
  if(r.type===A_CTR)return esc(r.refName)+(r.refCode?'<br><span class="note">'+esc(r.refCode)+'</span>':'');
  return esc(String(r.notes).slice(0,90))+(r.notes.length>90?'...':'');
}
function dLoc(r){
  if(r.lat===''||r.lat==null)return '-';
  return (r.distanceM!==''?'Photo '+r.distanceM+' m from '+(r.type===A_SCH?'school':'centre')+'<br>':'')+mapLink(r.lat,r.lng)+' +-'+r.gpsAcc+' m';
}
function dAct(r){
  if(r._pending)return '<span class="note">Not uploaded yet</span>';
  if(r.status==='Rejected')return '<button class="btn o sm" onclick="dDiscard(\''+r.id+'\')">Discard</button>';
  if(!canVerify())return '';
  var h='';
  if(r.status!=='Verified')h+='<button class="btn g sm" onclick="setDSt([\''+r.id+'\'],\'Verified\')">Verify</button> ';
  if(r.status!=='Returned')h+='<button class="btn o sm" onclick="setDSt([\''+r.id+'\'],\'Returned\')">Return</button> ';
  if(isAdmin())h+='<button class="btn o sm" onclick="delD(\''+r.id+'\')">Delete</button>';
  return h;
}
function DCOLS(keys){
  var A={
    date:{h:'Date',f:function(r){return esc(r.date)}},
    who:{h:'IE Official',f:function(r){return esc(r.officialName)+(r.designation?'<br><span class="note">'+esc(r.designation)+'</span>':'')+'<br><span class="note">'+esc(r.block)+'</span>'}},
    type:{h:'Activity',f:function(r){return esc(ACTSHORT[r.type]||r.type)}},
    what:{h:'Details',f:dWhat},
    purp:{h:'Purpose',f:function(r){return esc(r.purpose)}},
    cw:{h:'CWSN',f:function(r){return r.cwsn||'-'}},
    hrs:{h:'Hours',f:function(r){return r.hours||'-'}},
    notes:{h:'Remarks',f:function(r){return r.type===A_OTH?'-':(esc(r.notes)||'-')}},
    ph:{h:'Photos',f:photoCell},
    loc:{h:'Location',f:dLoc},
    sec:COLS(['sec'])[0],
    st:{h:'Status',f:function(r){return r.status==='Rejected'?'<span class="bad">REJECTED</span><br>'+esc(r.remark):esc(r.status)+(r.remark?'<br><span class="note">'+esc(r.remark)+'</span>':'')}},
    up:COLS(['up'])[0],
    dact:{h:'Action',a:1,f:dAct}
  };
  return keys.map(function(k){return A[k]});
}
function prepD(rows){rows.forEach(function(r){r._f=[];r._s=r.secFlags?String(r.secFlags).split(' ; '):[]});return rows}
function viewDlog(kind){
  var title={dlog:'My Activity Log',dreview:'Activity Review - '+esc(S.block),dall:'Daily Activity Log - all blocks'}[kind];
  var keys=kind==='dlog'?['date','type','what','purp','cw','hrs','ph','st','up','dact']:['date','who','type','what','purp','cw','hrs','ph'].concat(secure()?['loc','sec']:[],['st','dact']);
  RESFN=function(){
    var rows=prepD(dFilter(dScope(kind))),cnt=function(t){return rows.filter(function(r){return r.type===t}).length};
    var hrs=0;rows.forEach(function(r){hrs+=r.hours});
    var h='<div class="stats">'+stat('Activities',rows.length)+stat('School visits',cnt(A_SCH))+stat('Home visits (HBE)',cnt(A_HOME))+stat('Centre attendance',cnt(A_CTR))+stat('Other work',cnt(A_OTH))+stat('Hours',Math.round(hrs*10)/10)+(kind!=='dlog'&&secure()?stat('Security flags',rows.filter(function(r){return r._s.length}).length,'',rows.some(function(r){return r._s.length})):'')+'</div>';
    return h+grid(DCOLS(keys),rows);
  };
  var intro=kind==='dreview'?'<p class="note">Check each activity against its photos and location. Use <b>Verify</b>, or <b>Return</b> with a reason. "Verify all clean" verifies every pending activity shown that has no security flags.</p>':'';
  return '<h2>'+title+'</h2>'+intro+dBar(kind)+'<div id="res"></div>';
}
function dBar(kind){
  var users={};DREC.forEach(function(r){if(r.userId&&(kind==='dlog'||!S.block||r.block===S.block))users[r.userId]=r.officialName});
  STAFF.forEach(function(s){users[s.id]=s.name});
  var h='<div class="filters noprint"><input type="text" style="max-width:none" placeholder="Search school, child, place, official, remarks..." value="'+esc(D.q)+'" oninput="D.q=this.value;drawRes()"><div class="fgrid">';
  h+='<div><label>Month</label><input type="month" value="'+esc(D.month)+'" onchange="D.month=this.value;drawRes()"></div>';
  h+='<div><label>Activity</label><select onchange="D.type=this.value;drawRes()">'+opts(ACTS,D.type,'All activities')+'</select></div>';
  if(kind!=='dlog'){
    if(!S.block)h+='<div><label>Block</label><select onchange="D.block=this.value;drawRes()">'+opts(CFG.blocks,D.block,'All blocks')+'</select></div>';
    h+='<div><label>IE Official</label><select onchange="D.user=this.value;drawRes()"><option value="">All officials</option>'+Object.keys(users).map(function(k){return '<option value="'+esc(k)+'"'+(D.user===k?' selected':'')+'>'+esc(users[k])+'</option>'}).join('')+'</select></div>';
    h+='<div><label>Status</label><select onchange="D.status=this.value;drawRes()">'+opts(['Pending','Verified','Returned'],D.status,'Any status')+'</select></div>';
  }
  h+='</div><div style="margin-top:6px"><button class="btn sm" onclick="D.month=\'\';showTab(TAB)">All months</button>';
  if(kind!=='dlog')h+=' <button class="btn g sm" onclick="exportDaily(\''+kind+'\')">Download Excel</button> <button class="btn sm" onclick="bulkVerify(\''+kind+'\')">Verify all clean</button>';
  return h+' <button class="btn sm" onclick="window.print()">Print</button></div></div>';
}
function dDiscard(id){if(!confirm('Remove this rejected activity from your phone? You can enter it again correctly.'))return;DREC=DREC.filter(function(x){return x.id!==id});DOUT=DOUT.filter(function(x){return x!==id});idbDel(id);saveDrec();saveDout();banner();drawRes()}
function setDSt(ids,st,noPrompt){
  var remark='';
  if(st==='Returned'){remark=prompt('Reason for returning (the IE Official will see this):','');if(remark===null)return;if(!remark.trim()){alert('Please give a reason.');return}}
  var done=function(){DREC.forEach(function(r){if(ids.indexOf(r.id)>-1){r.status=st;r.remark=remark;r.verifiedBy=S.name||roleName(S.role);r.verifiedAt=new Date().toISOString()}});saveDrec();drawRes()};
  if(S.url)api('dstatus',{ids:ids,status:st,remark:remark}).then(function(j){done();flash(j.done+' activit'+(j.done===1?'y':'ies')+' set to '+st+'.')}).catch(function(e){flash('Could not update: '+e.message,'err')});else done();
}
function bulkVerify(kind){
  var rows=prepD(dFilter(dScope(kind))).filter(function(r){return r.status==='Pending'&&!r._s.length&&!r._pending});
  if(!rows.length)return alert('No pending activities without security flags in the current view.');
  if(!confirm('Verify '+rows.length+' pending activities that have no security flags?'))return;
  setDSt(rows.map(function(r){return r.id}),'Verified');
}
function delD(id){
  if(!confirm('Delete this activity permanently?'))return;
  var done=function(){DREC=DREC.filter(function(x){return x.id!==id});saveDrec();idbDel(id);drawRes()};
  if(S.url)api('ddelete',{id:id}).then(done).catch(function(e){flash('Could not delete: '+e.message,'err')});else done();
}
function exportDaily(kind){
  if(typeof XLSX==='undefined')return alert('The Excel library could not load. Connect to the internet and reload.');
  var rows=prepD(dFilter(dScope(kind))),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Date','Block','IE Official','Designation','Activity','Code','School / Centre','Child','Place','Purpose','CWSN','Hours','Remarks','Status','Verified by','Remark','Security flags','Latitude','Longitude','Photo distance m','Photos','User ID']].concat(rows.map(function(r){return [r.date,r.block,r.officialName,r.designation,r.type,r.refCode,r.refName,r.child,r.place,r.purpose,r.cwsn,r.hours,r.notes,r.status,r.verifiedBy,r.remark,r.secFlags,r.lat,r.lng,r.distanceM,r.photoLinks.join(' ; '),r.userId]}))),'Daily_Activity');
  XLSX.writeFile(wb,'IE_Daily_Activity_'+(D.month||'all')+'.xlsx');
}

// ---------- MONTHLY CONSOLIDATION ----------
function curMonth(){return today().slice(0,7)}
function defMonth(){var d=new Date();if(d.getDate()>=MCLOSE)return curMonth();var p=new Date(d.getFullYear(),d.getMonth()-1,1);return p.getFullYear()+'-'+pad(p.getMonth()+1)}
function mTotals(uid,month){
  var logs=DREC.filter(function(r){return r.userId===uid&&r.date.slice(0,7)===month&&r.status!=='Returned'&&r.status!=='Rejected'});
  var t={logs:logs.length,activeDays:0,schoolVisits:0,uniqueSchools:0,homeVisits:0,uniqueChildren:0,centreDays:0,otherActivities:0,totalHours:0,cwsnCovered:0,photos:0,flaggedLogs:0},days={},sch={},kid={},cd={};
  logs.forEach(function(x){
    days[x.date]=1;t.totalHours+=x.hours;t.cwsnCovered+=x.cwsn;t.photos+=x.photoCount||x.photoLinks.length;if(x.secFlags)t.flaggedLogs++;
    if(x.type===A_SCH){t.schoolVisits++;sch[(x.refCode||x.refName).toLowerCase()]=1}
    else if(x.type===A_HOME){t.homeVisits++;kid[x.child.toLowerCase()]=1}
    else if(x.type===A_CTR)cd[x.date]=1;else t.otherActivities++;
  });
  t.activeDays=Object.keys(days).length;t.uniqueSchools=Object.keys(sch).length;t.uniqueChildren=Object.keys(kid).length;t.centreDays=Object.keys(cd).length;t.totalHours=Math.round(t.totalHours*10)/10;
  return t;
}
function monthName(m){var p=m.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})}
function viewMonthly(){
  RESFN=null;if(!M.month)M.month=defMonth();
  return S.role==='field'?mField():mReview();
}
function monthPick(){return '<div class="filters noprint"><div class="fgrid"><div><label>Month</label><input type="month" max="'+curMonth()+'" value="'+esc(M.month)+'" onchange="M.month=this.value||defMonth();showTab(TAB)"></div></div></div>'}
function mHeadPrint(title,sub){return '<div class="printonly"><img src="'+esc(CFG.logo||LOGO_DATA)+'" style="height:60px"><h2 style="text-align:center">'+esc(title)+'<br>'+esc(sub)+'</h2><p style="text-align:center">Office of the District Mission Coordinator, Samagra Shiksha - '+esc(CFG.district)+'</p></div>'}
function mField(){
  var m=M.month,t=mTotals(S.id,m),sub=MREC.filter(function(r){return r.userId===S.id&&r.month===m})[0];
  var cur=curMonth(),dayNow=new Date().getDate(),why='';
  if(sub&&sub.status!=='Returned')why='This month is already '+sub.status.toLowerCase()+'.';
  else if(!t.logs)why='No activity is recorded for this month.';
  else if(m>cur)why='A future month cannot be consolidated.';
  else if(m===cur&&dayNow<MCLOSE)why='The current month can be consolidated from the '+MCLOSE+'th. Earlier months can be submitted any time.';
  else if(DOUT.length)why='Upload the '+DOUT.length+' activit'+(DOUT.length>1?'ies':'y')+' waiting on your phone first (tap Refresh data).';
  var h=mHeadPrint('Monthly Activity Report - IE Official',monthName(m)+' - '+S.name+(S.designation?' ('+S.designation+')':'')+' - '+S.block+' Block');
  h+='<h2 class="noprint">Monthly Report</h2><p class="note noprint">Your daily activities are consolidated automatically. Add a short summary and submit it for the BEEO and the District Office. The numbers are calculated by the server from your logs.</p>'+monthPick();
  if(sub){var c=sub.status==='Verified'?'okmsg':(sub.status==='Returned'?'err':'info');h+='<div class="'+c+' noprint"><b>Status: '+esc(sub.status)+'</b>'+(sub.remark?' - '+esc(sub.remark):'')+(sub.verifiedBy?' (by '+esc(sub.verifiedBy)+')':'')+'</div>'}
  h+='<div class="stats">'+stat('Active days',t.activeDays)+stat('School visits',t.schoolVisits,t.uniqueSchools+' different schools')+stat('Home visits (HBE)',t.homeVisits,t.uniqueChildren+' different children')+stat('Centre attendance days',t.centreDays)+stat('Other official work',t.otherActivities)+stat('Hours',t.totalHours)+stat('CWSN covered',t.cwsnCovered)+stat('Photos',t.photos)+stat('Logs with security flags',t.flaggedLogs,'',t.flaggedLogs>0)+'</div>';
  var rows=prepD(DREC.filter(function(r){return r.userId===S.id&&r.date.slice(0,7)===m&&r.status!=='Rejected'}).sort(function(a,b){return a.date<b.date?-1:1}));
  h+='<h3>Day-wise activities</h3>'+grid(DCOLS(['date','type','what','purp','cw','hrs','st']),rows);
  h+=fld('Summary of the month - key work and achievements *',sub&&sub.status!=='Returned'?'<div class="card">'+esc(sub.summary)+'</div>':'<textarea id="m_sum" rows="4" maxlength="1500">'+esc(sub?sub.summary:'')+'</textarea>');
  h+=fld('Challenges / support needed',sub&&sub.status!=='Returned'?'<div class="card">'+esc(sub.challenges||'-')+'</div>':'<textarea id="m_chal" rows="3" maxlength="1500">'+esc(sub?sub.challenges:'')+'</textarea>');
  h+='<div class="fld noprint">'+(why?'<div class="warn">'+esc(why)+'</div>':'')+'<button class="btn g big" '+(why?'disabled':'')+' onclick="submitMonthly()">Submit monthly report</button> <button class="btn" onclick="window.print()">Print</button></div>';
  h+='<div class="printonly"><br><br><table style="width:100%"><tr><td>Signature of IE Official</td><td style="text-align:right">Signature of BEEO</td></tr></table></div>';
  return h;
}
function submitMonthly(){
  var s=($('m_sum')||{}).value||'',c=($('m_chal')||{}).value||'';
  if(s.trim().length<10)return flash('Write a short summary of the month (at least 10 characters).','err');
  if(!confirm('Submit the report for '+monthName(M.month)+'? You cannot add activities to this month after submitting, unless it is returned to you.'))return;
  var done=function(rec){MREC=MREC.filter(function(r){return !(r.userId===rec.userId&&r.month===rec.month)}).concat([rec]);save('cwsn_mrec',MREC);showTab('monthly');flash('Monthly report submitted.')};
  if(S.url)api('msubmit',{month:M.month,summary:s,challenges:c}).then(function(j){done(j.record)}).catch(function(e){flash(e.message,'err')});
  else{var t=mTotals(S.id,M.month);done({id:M.month+'|'+S.id,month:M.month,block:S.block,userId:S.id,officialName:S.name,designation:S.designation||'',submittedAt:new Date().toISOString(),activeDays:t.activeDays,schoolVisits:t.schoolVisits,uniqueSchools:t.uniqueSchools,homeVisits:t.homeVisits,uniqueChildren:t.uniqueChildren,centreDays:t.centreDays,otherActivities:t.otherActivities,totalHours:t.totalHours,cwsnCovered:t.cwsnCovered,photos:t.photos,flaggedLogs:t.flaggedLogs,summary:s,challenges:c,status:'Submitted',verifiedBy:'',verifiedAt:'',remark:''})}
}
function mPeople(all){
  var p={};
  STAFF.forEach(function(s){p[s.id]={id:s.id,name:s.name,block:s.block,designation:s.designation}});
  DREC.forEach(function(r){if(r.status!=='Rejected'&&!p[r.userId])p[r.userId]={id:r.userId,name:r.officialName,block:r.block,designation:r.designation}});
  MREC.forEach(function(r){if(!p[r.userId])p[r.userId]={id:r.userId,name:r.officialName,block:r.block,designation:r.designation}});
  return Object.keys(p).map(function(k){return p[k]}).filter(function(x){return all||((!S.block||x.block===S.block)&&(!D.block||x.block===D.block))}).sort(function(a,b){return a.block<b.block?-1:a.block>b.block?1:(a.name<b.name?-1:1)});

function mRows(){
  return mPeople().map(function(p){
    var s=MREC.filter(function(r){return r.userId===p.id&&r.month===M.month})[0],live=mTotals(p.id,M.month);

}

function mSt(id,st){
  var remark='';
  if(st==='Returned'){remark=prompt('Reason for returning this report (the IE Official will see it):','');if(remark===null)return;if(!remark.trim()){alert('Please give a reason.');return}}
  var done=function(){MREC.forEach(function(r){if(r.id===id){r.status=st;r.remark=remark;r.verifiedBy=S.name||roleName(S.role)}});save('cwsn_mrec',MREC);showTab('monthly')};
  if(S.url)api('mstatus',{id:id,status:st,remark:remark}).then(done).catch(function(e){flash('Could not update: '+e.message,'err')});else done();
}

  data.push(['TOTAL','','',tot[0],tot[1],tot[2],tot[3],tot[4],tot[5],tot[6],Math.round(tot[7]*10)/10,tot[8]]);

// ---------- MASTER WORKBOOK IMPORT (District) ----------
function tc(s){return String(s==null?'':s).trim().replace(/\s+/g,' ').replace(/\b([a-z])/g,function(m){return m.toUpperCase()})}
function nk(s){return String(s).toLowerCase().replace(/[^a-z0-9]/g,'')}
function gv(r,names){for(var k in r){var n=nk(k);for(var i=0;i<names.length;i++){if(n===names[i])return r[k]}}for(var k2 in r){var n2=nk(k2);for(var j=0;j<names.length;j++){if(n2.indexOf(names[j])===0)return r[k2]}}return ''}
function sheetRows(wb,name){var n=null;wb.SheetNames.forEach(function(s){if(nk(s)===name||nk(s).indexOf(name)===0)n=s});return n?XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:''}):[]}
function modeFromAbbr(s){s=String(s||'').toLowerCase();if(s.indexOf('dcc')>-1||s.indexOf('day')>-1)return MODES[1];if(s.indexOf('hbe')>-1||s.indexOf('home')>-1)return MODES[2];return MODES[0]}
function specFor(d){d=String(d||'').toLowerCase();if(d.indexOf('speech')>-1)return DOMAINS[1];if(d.indexOf('counsel')>-1||d.indexOf('remedial')>-1)return DOMAINS[3];if(d.indexOf('physio')>-1||d.indexOf('sensory')>-1||d.indexOf('occupational')>-1)return DOMAINS[0];if(d.indexOf('mobility')>-1||d.indexOf('adl')>-1)return DOMAINS[2];return ''}
function importMaster(inp){
  var f=inp.files[0];if(!f)return;inp.value='';
  if(typeof XLSX==='undefined')return alert('Excel library could not load. Connect to the internet and reload.');
  var rd=new FileReader();
  rd.onload=function(){try{
    var wb=XLSX.read(rd.result,{type:'array'}),warn=[];
    var bR=sheetRows(wb,'block'),cR=sheetRows(wb,'centre'),iR=sheetRows(wb,'ieofficials'),tR=sheetRows(wb,'therapist');
    if(!cR.length)return alert('The sheet "Centre" was not found or is empty. This does not look like the master workbook.');
    var byCode={},blocks=[],codes={};
    bR.forEach(function(r){var n=tc(gv(r,['blkname','blockname']));if(n){byCode[String(gv(r,['blkcode','blockcode']))]=n;if(blocks.indexOf(n)<0)blocks.push(n);codes[n]=String(gv(r,['blkcode','blockcode']))}});
    var bn=function(r){var n=tc(gv(r,['blkname','blockname']));if(!n)n=byCode[String(gv(r,['blkcode','blockcode']))]||'';if(n&&blocks.indexOf(n)<0){blocks.push(n)}return n};
    var ieByCentre={},users={};
    iR.forEach(function(r){
      var st=String(gv(r,['status'])||'Active').toLowerCase();if(st.indexOf('active')<0)return;
      var ph=String(gv(r,['phoneno','phone','mobile'])).replace(/\D/g,'').slice(-10),nm=String(gv(r,['nameieofficial','name'])).trim(),cc=String(gv(r,['centrecode'])),b=bn(r);
      if(!/^[6-9][0-9]{9}$/.test(ph)){warn.push('IE Official "'+nm+'": phone number is not a valid 10-digit mobile - skipped.');return}
      (ieByCentre[cc]=ieByCentre[cc]||[]).push(ph);
      if(!users[ph])users[ph]={name:nm,mobile:ph,role:'field',block:b,designation:String(gv(r,['designation'])).trim()};
      else if(users[ph].block!==b)warn.push('IE Official "'+nm+'" appears in more than one block; the first block ('+users[ph].block+') is used.');
    });
    var centres=[],seenXY={};
    cR.forEach(function(r){
      var cc=String(gv(r,['centrecode'])),nm=tc(gv(r,['centrename'])),b=bn(r);if(!cc||!nm)return;
      var c={block:b,mode:modeFromAbbr(gv(r,['mode'])),name:nm,code:cc,assigned:(ieByCentre[cc]||[]).filter(function(x,i,a){return a.indexOf(x)===i})};
      var la=parseFloat(gv(r,['lat','latitude'])),lo=parseFloat(gv(r,['long','lng','longitude']));
      if(isFinite(la)&&isFinite(lo)&&la&&lo){c.lat=la;c.lng=lo;c.locBy='Master file';c.locAt=today();if(c.mode.indexOf('Home')<0){var k=la+','+lo;(seenXY[k]=seenXY[k]||[]).push(nm)}}
      centres.push(c);
    });
    Object.keys(seenXY).forEach(function(k){if(seenXY[k].length>1)warn.push('Identical coordinates ('+k+') for: '+seenXY[k].join(', ')+'. These look like placeholders. The geo-fence will block entries made at the real location until corrected.')});
    var centreByCode={};centres.forEach(function(c){centreByCode[c.code]=c});
    Object.keys(ieByCentre).forEach(function(cc){if(!centreByCode[cc])warn.push('IE Official sheet refers to centre code '+cc+' which is not in the Centre sheet.')});
    var ths=[];
    tR.forEach(function(r){
      var st=String(gv(r,['status'])||'Active').toLowerCase();if(st.indexOf('active')<0)return;
      var cc=String(gv(r,['assigendcentrecode','assignedcentrecode','centrecode'])),ce=centreByCode[cc],nm=String(gv(r,['nameth','name'])).trim();
      if(!nm)return;if(!ce)warn.push('Therapist "'+nm+'": centre code '+cc+' is not in the Centre sheet.');
      ths.push({name:nm,qual:String(gv(r,['qualification'])).trim(),domain:String(gv(r,['domain'])).trim(),mobile:String(gv(r,['mobile','phone'])).replace(/\D/g,'').slice(-10),code:cc,centre:ce?ce.name:tc(gv(r,['assigendcentrename','assignedcentrename'])),block:ce?ce.block:bn(r)});
    });
    var ulist=Object.keys(users).map(function(k){return users[k]});
    var msg='Import the master workbook?\n\nBlocks: '+blocks.length+'\nCentres: '+centres.length+' ('+centres.filter(function(c){return c.lat}).length+' with coordinates)\nIE Officials (logins): '+ulist.length+'\nTherapists: '+ths.length+'\n\nThis REPLACES the current blocks, centres and therapist list. Existing logins are updated, new logins get a PIN.'+(warn.length?'\n\nCHECK THESE:\n- '+warn.join('\n- '):'');
    if(!confirm(msg))return;
    blocks.sort();
    var old={};CFG.centres.forEach(function(c){old[c.code||c.name]=c});
    centres.forEach(function(c){var o=old[c.code];if(!c.lat&&o&&o.lat){c.lat=o.lat;c.lng=o.lng;c.locBy=o.locBy;c.locAt=o.locAt}});
    CFG.blocks=blocks;CFG.blockCodes=codes;CFG.centres=centres;CFG.therapists=ths;saveCfg();
    pushCfg('Master data imported.').then(function(){
      if(!S.url||!ulist.length){showTab('setup');return}
      return api('userSave',{items:ulist}).then(function(j){SEC.pins=(SEC.pins||[]).concat(j.results.filter(function(x){return x.pin}));SEC.tab='users';var bad=j.results.filter(function(x){return x.error});showTab('security');if(bad.length)flash(bad.length+' login(s) not created: '+bad.map(function(e){return (e.name||e.id)+' ('+e.error+')'}).join('; '),'err')});
    }).catch(function(e){flash(e.message,'err')});
  }catch(e){alert('Could not read this file: '+e.message)}};
  rd.readAsArrayBuffer(f);
}

// ---------- SCHOOL MASTER IMPORT (District) ----------
function importSchools(inp){
  var f=inp.files[0];if(!f)return;inp.value='';
  if(typeof XLSX==='undefined')return alert('Excel library could not load. Connect to the internet and reload.');
  var rd=new FileReader();
  rd.onload=function(){try{
    var wb=XLSX.read(rd.result,{type:'array'}),rows=sheetRows(wb,'school');
    if(!rows.length)rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    var rev={};Object.keys(CFG.blockCodes||{}).forEach(function(n){rev[String(CFG.blockCodes[n])]=n});
    var items=[],skipNoBlock=0,noLoc=0,seen={},dups=0;
    rows.forEach(function(r){
      var ud=String(gv(r,['udisecode','udise','schoolcode'])).trim(),nm=String(gv(r,['schoolname','nameofschool','school'])).trim();
      var b=tc(gv(r,['blkname','blockname','block']));if(!b)b=rev[String(gv(r,['blkcode','blockcode']))]||'';
      if(!ud||!nm)return;
      if(!b||CFG.blocks.indexOf(b)<0){skipNoBlock++;return}
      if(seen[ud]){dups++;return}seen[ud]=1;
      var la=parseFloat(gv(r,['latitude','lat'])),lo=parseFloat(gv(r,['longitude','long','lng','lon']));
      var ok=isFinite(la)&&isFinite(lo)&&la&&lo;if(!ok)noLoc++;
      items.push({block:b,udise:ud,name:nm,village:String(gv(r,['village','cluster','locality'])).trim(),lat:ok?la:'',lng:ok?lo:'',cwsn:num(gv(r,['cwsncount','noofcwsn','totalcwsn','cwsn']))});
    });
    if(!items.length)return alert('No usable school rows found. Columns needed: Block (or Blk Name / Blk code), UDISE Code, School Name, Latitude, Longitude. Optional: Village, CWSN Count. Blocks must match the block list.'+(skipNoBlock?'\n\n'+skipNoBlock+' rows were skipped because the block was missing or not in the block list.':''));
    var msg='Import '+items.length+' schools?\n\nWith location: '+(items.length-noLoc)+'\nWithout location: '+noLoc+(skipNoBlock?'\nSkipped (block not recognised): '+skipNoBlock:'')+(dups?'\nSkipped duplicates (same UDISE): '+dups:'')+'\n\nThis REPLACES the current school list.';
    if(!confirm(msg))return;
    var done=function(){SCH=items;save('cwsn_sch',SCH);showTab('setup');flash(items.length+' schools imported.')};
    if(S.url)api('schoolsSave',{items:items}).then(done).catch(function(e){flash(e.message,'err')});else done();
  }catch(e){alert('Could not read this file: '+e.message)}};
  rd.readAsArrayBuffer(f);
}
function schoolTemplate(){
  if(typeof XLSX==='undefined')return alert('The Excel library could not load. Connect to the internet and reload.');
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Blk code','Blk Name','UDISE Code','School Name','Village / Cluster','Latitude','Longitude','CWSN Count'],[181701,'Central','18170100101','Sample LP School','Sample Village',26.7509,94.2037,3]]),'School');
  XLSX.writeFile(wb,'School_Master_Template.xlsx');
}

// ---------- DISTRICT DASHBOARD: IE Officials' daily activity and monthly reports ----------
function dashIE(){
  var tdy=today(),cm=curMonth(),rm=defMonth(),ppl=mPeople(true);
  var act=DREC.filter(function(r){return r.status!=='Rejected'&&r.status!=='Returned'});
  var td=act.filter(function(r){return r.date===tdy}),tdU={};td.forEach(function(r){tdU[r.userId]=1});
  var mo=act.filter(function(r){return r.date.slice(0,7)===cm}),cnt=function(a,t){return a.filter(function(r){return r.type===t}).length};
  var cdays=function(a){var o={};a.forEach(function(r){if(r.type===A_CTR)o[r.userId+'|'+r.date]=1});return Object.keys(o).length};
  var subs=MREC.filter(function(r){return r.month===rm&&r.status!=='Returned'}),ver=subs.filter(function(r){return r.status==='Verified'}).length;
  var fl=mo.filter(function(r){return r.secFlags}).length,nl=ppl.filter(function(p){return tdU[p.id]}).length;
  var h='<h3>IE Officials - Daily Activity and Monthly Report</h3><div class="stats">'+stat('IE Officials',ppl.length)+stat('Logged activity today',nl,'of '+ppl.length+' IE Officials')+stat('Activities today',td.length)+
    stat('School visits',cnt(mo,A_SCH),monthName(cm))+stat('Home visits (HBE)',cnt(mo,A_HOME),monthName(cm))+stat('Centre attendance days',cdays(mo),monthName(cm))+stat('Other official work',cnt(mo,A_OTH),monthName(cm))+
    stat('Monthly reports ('+monthName(rm)+')',subs.length,'of '+ppl.length+' submitted, '+ver+' verified',ppl.length>0&&subs.length<ppl.length)+stat('Activities with warnings',fl,monthName(cm)+' - see Security & Audit',fl>0)+'</div>';
  var blocks=CFG.blocks.filter(function(b){return ppl.some(function(p){return p.block===b})||mo.some(function(r){return r.block===b})});
  if(blocks.length)h+=tbl(['Block','IE Officials','Logged today','Activities ('+monthName(cm)+')','School visits','Home visits','Centre days','Reports ('+monthName(rm)+')'],blocks.map(function(b){
    var pb=ppl.filter(function(p){return p.block===b}),mb=mo.filter(function(r){return r.block===b});
    return '<tr><td>'+esc(b)+'</td><td class="r">'+pb.length+'</td><td class="r">'+pb.filter(function(p){return tdU[p.id]}).length+'</td><td class="r">'+mb.length+'</td><td class="r">'+cnt(mb,A_SCH)+'</td><td class="r">'+cnt(mb,A_HOME)+'</td><td class="r">'+cdays(mb)+'</td><td class="r">'+subs.filter(function(s){return s.block===b}).length+'</td></tr>'}),[1,2,3,4,5,6,7]);
  else h+='<p class="note">No IE Official activity yet. Create the IE Official logins in Centres &amp; Settings (master workbook upload).</p>';
  var nolog=ppl.filter(function(p){return !tdU[p.id]});
  if(ppl.length&&nolog.length)h+='<p class="note"><b>No activity logged today:</b> '+nolog.slice(0,40).map(function(p){return esc(p.name)+' ('+esc(p.block)+')'}).join('; ')+(nolog.length>40?' ...':'')+'</p>';
  return h+'<p class="noprint"><button class="btn sm" onclick="showTab(\'dall\')">Open Activity Log</button> <button class="btn sm" onclick="showTab(\'monthly\')">Open Monthly Reports</button></p>';
}
