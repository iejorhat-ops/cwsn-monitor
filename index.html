<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffe4ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CWSN Therapeutic Services Monitoring System</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;font-size:15px;margin:0;background:#fff;color:#000}
h2{font-size:20px;margin:10px 0}
h3{font-size:17px;margin:18px 0 6px;border-bottom:2px solid #ff8000;padding-bottom:3px}
#hdr{background:#ffe4ec;border-bottom:3px solid #ff8000;padding:8px 12px}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logoimg{height:60px;width:auto;max-width:190px;background:#fff;border:1px solid #ff8000}
.logo{width:46px;height:46px;background:#ff8000;color:#fff;font-weight:bold;font-size:20px;text-align:center;line-height:46px;border:2px solid #b34700}
.ht{flex:1;min-width:200px;font-size:16px}
.sub{font-size:13px}
.hu{font-size:13px;text-align:right}
#tabs{padding:6px 8px 0 8px;border-bottom:1px solid #ff8000}
.tab{font-family:Arial;font-size:14px;background:#fff;color:#000;border:1px solid #ff8000;padding:8px 12px;margin:0 2px 0 0;cursor:pointer;border-radius:0}
.tab.on{background:#ffe4ec;font-weight:bold;border-bottom:3px solid #ff8000}
#main{padding:10px 12px;max-width:1300px;margin:0 auto}
#foot:empty{display:none}
#foot{border-top:3px solid #ff8000;background:#ffe4ec;padding:8px 12px;font-size:12px;margin-top:20px}
.btn{font-family:Arial;font-size:15px;padding:9px 16px;border:1px solid #000;color:#000;background:#ff9933;cursor:pointer;border-radius:0;margin:2px}
.btn.g{background:#008000;color:#fff}
.btn.o{background:#ffc2d4;color:#000}
.btn.sm{padding:3px 8px;font-size:13px}
.btn.big{font-size:18px;padding:12px 24px}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=password],input[type=url],textarea,select{width:100%;max-width:520px;padding:8px;font-size:16px;font-family:Arial;border:1px solid #666;background:#fff;border-radius:0;color:#000}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=password],input[type=url],textarea{-webkit-appearance:none;appearance:none}
input[type=radio],input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin:0 4px 0 0}
.fld{margin:12px 0}
.fld .t{display:block;font-weight:bold;margin-bottom:4px}
.opt{display:inline-block;margin:2px 8px 2px 0;padding:6px 10px;border:1px solid #999;background:#fff;cursor:pointer}
.hint{font-size:12px;color:#333}
.err{border:2px solid #cc0000;background:#ffe0e0;padding:8px;margin:8px 0}
.okmsg{border:2px solid #008000;background:#e0ffe0;padding:8px;margin:8px 0}
.warn{border:2px solid #ff8000;background:#fff0d9;padding:8px;margin:8px 0}
.info{border:1px solid #ff8000;background:#fff5f8;padding:8px;margin:8px 0}
.note{color:#333;font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.stat{border:1px solid #ff8000;background:#fff;padding:8px;min-width:140px;flex:1}
.stat .n{font-size:24px;font-weight:bold;color:#e65c00}
.stat .lb{font-size:13px}
.stat .nt{font-size:11px;color:#333}
.stat.bad .n{color:#cc0000}
.filters{border:1px solid #ff8000;background:#fff5f8;padding:8px;margin:8px 0}
.fgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.fgrid>div{flex:1;min-width:130px}
.fgrid label{font-size:12px;font-weight:bold;display:block}
.fgrid select,.fgrid input{max-width:none}
.chip{display:inline-block;border:1px solid #ff8000;padding:5px 11px;margin:3px 3px 0 0;background:#fff;cursor:pointer;font-size:13px}
.chip.on{background:#ff9933;color:#000;font-weight:bold}
.scroll{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{border:1px solid #000;padding:4px 6px;text-align:left;vertical-align:top;background:#fff}
.tbl th{background:#ffe4ec}
.tbl tr:nth-child(even) td{background:#fff5f8}
.tbl tr.flag td{background:#ffc9c0}
.tbl tr.tot td{background:#ffe4ec;font-weight:bold}
.cards{display:none}
.card{border:1px solid #000;padding:6px 8px;margin:6px 0;background:#fff;font-size:14px}
.card:nth-child(even){background:#fff5f8}
.card.flag{background:#ffc9c0}
.ok{color:#008000;font-weight:bold}
.bad{color:#cc0000;font-weight:bold}
.bar{background:#ffe4ec;height:14px;border:1px solid #ff8000;min-width:80px}
.bar i{display:block;height:100%;background:#ff9933}
.count{font-size:13px;margin:6px 0}
.thumbs img{width:90px;height:90px;object-fit:cover;border:1px solid #000;margin:3px}
.thumbs .th{display:inline-block;position:relative}
.thumbs .th button{position:absolute;top:3px;right:3px;background:#ffc2d4;border:1px solid #000;font-size:12px;padding:0 5px;border-radius:0}
#ov{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;overflow:auto;padding:10px;z-index:9}
#ov img{max-width:100%;border:1px solid #000;margin:6px 0;display:block}
.printonly{display:none}
@media (max-width:760px){
 .tbl-wrap{display:none}
 .cards{display:block}
 .hu{text-align:left}
 .stat{min-width:45%}
 .tab{padding:8px 9px;font-size:13px;margin-bottom:2px}
}
@media print{
 #hdr,#tabs,#banner,.filters,.noprint,#foot,.cards,.act,#msg{display:none!important}
 .printonly{display:block!important}
 .tbl-wrap{display:block!important}
 body{font-size:11px}
 .tbl{font-size:10px}
 .tbl tr:nth-child(even) td{background:#fff}
}
</style>
</head>

<div id="banner"></div>
<div id="main"></div>
<div id="ov"></div>

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return iso(new Date())}
function monthStart(){var d=new Date();return iso(new Date(d.getFullYear(),d.getMonth(),1))}
function daysAgo(n){var d=new Date();d.setDate(d.getDate()-n);return iso(d)}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function inr(n){return 'Rs. '+Number(n||0).toLocaleString('en-IN')}
function uid(){return 'R'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return ''+h}
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('Phone storage is full. Please upload pending entries and clear old data.')}}

// ---------- photo store (IndexedDB) ----------
function idb(){return new Promise(function(res,rej){if(!window.indexedDB)return rej(new Error('no idb'));var r=indexedDB.open('cwsn',1);r.onupgradeneeded=function(){r.result.createObjectStore('photos')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function idbSet(k,v){return idb().then(function(db){return new Promise(function(res,rej){var t=db.transaction('photos','readwrite');t.objectStore('photos').put(v,k);t.oncomplete=res;t.onerror=function(){rej(t.error)}})})}
var MEMPH={};
function idbGet(k){return idb().then(function(db){return new Promise(function(res,rej){var q=db.transaction('photos').objectStore('photos').get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})}).catch(function(){return null}).then(function(v){return v||MEMPH[k]||null})}
function idbDel(k){return idb().then(function(db){return new Promise(function(res){var t=db.transaction('photos','readwrite');t.objectStore('photos').delete(k);t.oncomplete=res;t.onerror=res})}).catch(function(){})}

// ---------- server ----------
function api(action,payload){
  if(!S.url)return Promise.reject(new Error('No server'));
  var ctrl=window.AbortController?new AbortController():null;
  var t=setTimeout(function(){if(ctrl)ctrl.abort()},90000);
  return fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:action,role:S.role,name:S.name,block:S.block,payload:payload||{}}),signal:ctrl?ctrl.signal:undefined})
  .then(function(r){clearTimeout(t);return r.json()})
  .then(function(j){if(!j.ok){var e=new Error(j.error||'Server error');e.server=true;throw e}return j});
}
function norm(r){
  var o={};KEYS.forEach(function(k){o[k]=r[k]==null?'':r[k]});
  ['operatingDays','present','domains','photoLinks'].forEach(function(k){var v=r[k];o[k]=Array.isArray(v)?v:(v?String(v).split(' | '):[])});
  ['daysFunctioned','cwsn','therapistDays','dailyHonorarium','totalHonorarium','contingency','sessions'].forEach(function(k){o[k]=num(r[k])});
  o.weekEnding=String(o.weekEnding).slice(0,10);o.phone=String(o.phone||'');o.status=o.status||'Pending';
  o.photoCount=o.photoLinks.length||num(r.photoCount);o.localPhotos=!!r.localPhotos;o._pending=!!r._pending;
  return o;
}
function refreshData(){
  if(!S.url)return Promise.resolve();
  return api('list').then(function(j){
    var pend=REC.filter(function(r){return r._pending});
    REC=j.rows.map(norm).concat(pend);saveRec();
  });
}
function syncOutbox(){
  if(!S.url||!OUT.length||SYNCING)return Promise.resolve();
  SYNCING=true;var sent=0,failMsg='';
  return OUT.slice().reduce(function(p,id){return p.then(function(){
    var r=REC.filter(function(x){return x.id===id})[0];
    if(!r){OUT=OUT.filter(function(i){return i!==id});return}
    return idbGet(id).then(function(ph){
      var rec={};KEYS.forEach(function(k){rec[k]=r[k]});
      return api('submit',{record:rec,photos:(ph||[]).map(function(p,i){return {name:(r.weekEnding+'_'+r.centre+'_'+(i+1)).replace(/[^A-Za-z0-9_-]+/g,'_')+'.jpg',mime:'image/jpeg',data:p.data.split(',')[1]}})});
    }).then(function(j){
      var n=norm(j.record);REC=REC.map(function(x){return x.id===id?n:x});
      OUT=OUT.filter(function(i){return i!==id});idbDel(id);sent++;
    });
  })},Promise.resolve()).catch(function(e){failMsg=e.message||'network'}).then(function(){
    SYNCING=false;saveRec();saveOut();banner();
    if(sent)flash('Uploaded '+sent+' entr'+(sent>1?'ies':'y')+' to the district server.');
    if(failMsg&&!/Failed to fetch|NetworkError|Load failed|abort/i.test(failMsg))flash('Upload problem: '+failMsg,'err');
    if(sent&&RESFN)drawRes();
  });
}
window.addEventListener('online',function(){syncOutbox()});

  '<button class="btn big" onclick="doLogin()">Login</button>'+
  '<details style="margin-top:20px"><summary>Server connection (District Office only)</summary><div class="fld"><label class="t">Web App URL</label><input type="url" id="l_url" value="'+esc(S.url)+'" placeholder="https://script.google.com/macros/s/.../exec"><div class="hint">Leave empty to use Local mode (data stays on this device only, for testing).</div></div></details>';
  $('main').innerHTML=h;loginRole();
}
function loginRole(){var r=rv('l_role');if($('l_nm'))$('l_nm').style.display=(r==='district')?'none':'block';if($('l_bl'))$('l_bl').style.display=(r==='district')?'none':'block'}
function doLogin(){
  var role=rv('l_role'),name=$('l_name').value.trim(),block=$('l_block').value,url=$('l_url').value.trim();
  var er=[];if(!role)er.push('Choose who you are.');if(role!=='district'&&role){if(!name)er.push('Enter your name.');if(!block)er.push('Select your block.')}
  if(er.length)return flash(er.join(' '),'err');
  S={url:url||DEFAULT_URL,role:role,name:role==='district'?'District Office':name,block:role==='district'?'':block};
  if(S.url){
    flash('Logging in...','info');
    api('login').then(function(j){
      var c=j.config||{};CFG.district=c.district||CFG.district;if(c.blocks&&c.blocks.length)CFG.blocks=c.blocks;CFG.centres=c.centres||[];CFG.budget=c.budget||0;saveCfg();
      try{localStorage.setItem('cwsn_ok','1')}catch(e){}
      saveS();return refreshData();
    }).then(start).catch(function(e){
      if(e.server){S.role='';flash(e.message,'err');return}
      if(localStorage.getItem('cwsn_ok')==='1'){saveS();start();flash('No internet. Working offline - entries will upload later.','warn')}
      else{S.role='';flash('Cannot reach the server. Check internet. (First login needs internet.)','err')}
    });
  }else{
    saveS();start();
  }
}
function logout(){S.role='';saveS();showLogin()}
function start(){
  if(!S.role)return showLogin();
  F.block=S.block||'';F.chip='all';F.q='';F.status='';F.sample=null;
  drawHdr();showTab(tabsFor()[0][0]);banner();syncOutbox();
}
function refreshBtn(){
  if(!S.url){flash('Local mode: nothing to refresh.','info');return}
  flash('Refreshing...','info');
  syncOutbox().then(refreshData).then(function(){flash('Data refreshed.');if(RESFN)drawRes();else showTab(TAB)}).catch(function(e){flash('Could not refresh: '+(e.message||'no internet'),'err')});
}
function tabsFor(){
  var v=[['dash','Dashboard'],['grid','Centre Activity'],['alerts','Compliance Alerts'],['photos','Photo Verification'],['report','Higher Authority Report']],h=[['help','Help']];
  if(S.role==='field')return [['entry','New Entry'],['mine','My Entries']].concat(v,h);

  $('tabs').innerHTML=tabsFor().map(function(x){return '<button class="tab'+(x[0]===t?' on':'')+'" onclick="showTab(\''+x[0]+'\')">'+x[1]+'</button>'}).join('');

// ---------- form helpers ----------
function opts(list,sel,first){return (first!=null?'<option value="">'+esc(first)+'</option>':'')+list.map(function(v){return '<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(v)+'</option>'}).join('')}
function radios(name,list,checked,extra){return list.map(function(v){return '<label class="opt"><input type="radio" name="'+name+'" value="'+esc(v)+'" '+(v===checked?'checked ':'')+(extra||'')+'> '+esc(v)+'</label>'}).join('')}
function checks(name,list,extra){return list.map(function(v){return '<label class="opt"><input type="checkbox" name="'+name+'" value="'+esc(v)+'" '+(extra||'')+'> '+esc(v)+'</label>'}).join('')}
function rv(name){var e=document.querySelector('input[name="'+name+'"]:checked');return e?e.value:''}
function cv(name){return [].slice.call(document.querySelectorAll('input[name="'+name+'"]:checked')).map(function(e){return e.value})}
function fld(label,inner,hint){return '<div class="fld"><label class="t">'+label+'</label>'+inner+(hint?'<div class="hint">'+hint+'</div>':'')+'</div>'}

function modeChg(){refreshCentres();var d=$('e_dc');if(d)d.style.display=isDC(rv('e_mode'))?'block':'none'}
function refreshCentres(){
  var b=$('e_blk').value,m=rv('e_mode'),sel=$('e_ctr');
  if(!b||!m){sel.innerHTML='<option value="">-- Select block and mode first --</option>';$('e_new').style.display='none';return}
  var list=CFG.centres.filter(function(c){return c.block===b&&c.mode===m});
  sel.innerHTML='<option value="">-- Select centre --</option>'+list.map(function(c){return '<option value="'+esc(c.name)+'" data-code="'+esc(c.code||'')+'">'+esc(c.name)+(c.code?' ('+esc(c.code)+')':'')+'</option>'}).join('')+'<option value="__new">Not in list - type name</option>';
  if(!list.length)sel.value='__new';
  ctrChg();

function ctrChg(){$('e_new').style.display=$('e_ctr').value==='__new'?'block':'none'}
function calcTot(){$('e_tot').textContent=inr(num($('e_td').value)*num($('e_hr').value))}
function addPhotos(inp){
  var files=[].slice.call(inp.files);inp.value='';
  var room=5-PH.length;if(files.length>room){alert('Maximum 5 photos per entry.');files=files.slice(0,Math.max(room,0))}
  files.reduce(function(p,f){return p.then(function(){
    if(f.size>10*1024*1024){alert(f.name+' is larger than 10 MB and was skipped.');return}
    return shrink(f).then(function(d){PH.push({name:f.name,data:d})}).catch(function(){alert('Could not read '+f.name)});
  })},Promise.resolve()).then(drawPh);
}
function shrink(f){return new Promise(function(res,rej){
  var img=new Image(),u=URL.createObjectURL(f);
  img.onload=function(){
    var m=1280,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    var x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
    var t=new Date(),fs=Math.max(14,Math.round(c.width/40));
    x.fillStyle='rgba(255,255,255,0.85)';x.fillRect(0,c.height-fs-10,c.width,fs+10);
    x.fillStyle='#000';x.font='bold '+fs+'px Arial';x.fillText(t.toLocaleDateString('en-GB')+' '+t.toLocaleTimeString('en-GB'),8,c.height-7);
    URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.7));
  };
  img.onerror=function(){rej(new Error('bad image'))};img.src=u;
})}
function drawPh(){var e=$('e_thumbs');if(e)e.innerHTML=PH.map(function(p,i){return '<span class="th"><img src="'+p.data+'"><button onclick="PH.splice('+i+',1);drawPh()">X</button></span>'}).join('')}
function submitEntry(){
  var er=[],we=$('e_we').value,blk=$('e_blk').value,mode=rv('e_mode'),ctr=$('e_ctr').value,cname='',ccode='';
  if(ctr==='__new'){cname=$('e_cname').value.trim();ccode=$('e_ccode').value.trim()}
  else if(ctr){cname=ctr;var o=$('e_ctr').options[$('e_ctr').selectedIndex];ccode=o?o.getAttribute('data-code')||'':''}
  var days=parseInt($('e_days').value,10),opd=cv('e_opd'),off=cv('e_off'),pn=$('e_pn').value.trim(),ph=$('e_ph').value.trim();
  var reg=rv('e_reg'),iep=rv('e_iep'),cw=$('e_cw').value,dm=rv('e_dm'),pre=rv('e_pre'),dom=cv('e_dom'),ses=$('e_ses').value;
  var th=$('e_th').value.trim(),sp=$('e_sp').value,td=num($('e_td').value),hr=num($('e_hr').value),ct=num($('e_ct')?$('e_ct').value:0),dc=isDC(mode);
  if(!we)er.push('Select the week ending date.');else if(we>today())er.push('Week ending date cannot be in the future.');
  if(!blk)er.push('Select the block.');if(!mode)er.push('Select the service delivery mode.');if(!cname)er.push('Select or type the centre name.');
  if(!opd.length)er.push('Tick the designated operating days.');
  if(isNaN(days)||days<1||days>6)er.push('Days functioned must be from 1 to 6.');
  if(!off.length)er.push('Tick the officials present.');if(!pn)er.push('Enter the name of the officer / special educator.');
  if(!/^[6-9][0-9]{9}$/.test(ph))er.push('Enter a valid 10-digit mobile number.');
  if(!reg)er.push('Answer: attendance register maintained?');if(!iep)er.push('Answer: IEP updated?');
  if(cw===''||isNaN(parseInt(cw,10))||parseInt(cw,10)<0)er.push('Enter the total CWSN attended.');
  if(dc&&!dm)er.push('Answer: at least 10 CWSN every operating day?');
  if(!pre)er.push('Answer: formal assessment completed before therapy?');
  else if(pre==='No')er.push('Therapy cannot be recorded without a prior formal assessment. Complete the assessment first.');
  if(!dom.length)er.push('Tick at least one therapy domain.');
  if(ses===''||isNaN(parseInt(ses,10)))er.push('Enter the number of therapy sessions.');
  if((td>0||hr>0)&&!th)er.push('Enter the therapist name (honorarium is being claimed).');
  if(td<0||td>6)er.push('Therapist working days must be from 0 to 6.');
  if(hr>CAP_DAY)er.push('Amount cannot exceed Rs. 1,500 per guidelines.');
  if(ct>CAP_CONT)er.push('Contingency cannot exceed Rs. 500 per month.');
  if(!PH.length)er.push('Add at least one therapy session photograph.');
  if(er.length){$('errs').innerHTML='<div class="err"><b>Please correct:</b><br>- '+er.map(esc).join('<br>- ')+'</div>';window.scrollTo(0,0);return}
  var rec={timestamp:new Date().toISOString(),id:uid(),weekEnding:we,block:blk,mode:mode,centre:cname,centreCode:ccode,operatingDays:opd,daysFunctioned:days,present:off,personName:pn,phone:ph,registerOk:reg,iepOk:iep,cwsn:parseInt(cw,10),dailyMinMet:dc?dm:'NA',preAssessment:'Yes',domains:dom,therapist:th,specialization:sp,therapistDays:td,dailyHonorarium:hr,totalHonorarium:td*hr,contingency:dc?ct:0,sessions:parseInt(ses,10),photoLinks:[],submittedBy:S.name,status:'Pending',verifiedBy:'',verifiedAt:'',remark:'',flags:'',photoCount:PH.length,localPhotos:!S.url};
  var n=norm(rec),c=buildCtx(scope().concat([n])),fl=flagsOf(n,c);
  if(fl.length&&!confirm('This entry will be marked with these audit flags:\n\n- '+fl.join('\n- ')+'\n\nSubmit anyway?'))return;
  $('e_go').disabled=true;
  MEMPH[rec.id]=PH.slice();
  idbSet(rec.id,PH.slice()).catch(function(){}).then(function(){
    if(!S.url){REC.push(n);saveRec();showTab('entry');flash('Entry saved on this device (local mode).');return}
    n._pending=true;REC.push(n);OUT.push(rec.id);saveRec();saveOut();banner();showTab('entry');
    flash('Entry saved. Uploading to the district server...');syncOutbox();
  });
}

// ---------- COMPLIANCE ----------
function buildCtx(all){
  var c={cm:{},cmon:{},dup:{}};
  all.forEach(function(r){
    var ck=r.block+'|'+r.centre,m=r.weekEnding.slice(0,7);
    c.cm[ck+'|'+m]=(c.cm[ck+'|'+m]||0)+r.contingency;
    if(r.contingency>0){c.cmon[ck]=c.cmon[ck]||{};c.cmon[ck][m]=1}
    c.dup[ck+'|'+r.weekEnding]=(c.dup[ck+'|'+r.weekEnding]||0)+1;
  });
  return c;
}
function flagsOf(r,c){
  var f=[],dc=isDC(r.mode),ck=r.block+'|'+r.centre,m=r.weekEnding.slice(0,7);
  if(dc&&r.daysFunctioned<MIN_DAYS)f.push('Under 3 days/week');
  if(dc&&(r.cwsn<MIN_CWSN||r.dailyMinMet==='No'))f.push('Under 10 CWSN/day');
  if(r.dailyHonorarium>CAP_DAY)f.push('Honorarium above Rs. 1,500/day');
  if(r.iepOk==='No')f.push('IEP not updated');
  if(r.registerOk==='No')f.push('Attendance register not maintained');
  if(r.preAssessment!=='Yes')f.push('No prior assessment');
  if(!(r.photoCount>0))f.push('No photo uploaded');
  if(r.contingency>0&&c.cm[ck+'|'+m]>CAP_CONT)f.push('Contingency above Rs. 500 this month');
  if(r.contingency>0&&c.cmon[ck]&&Object.keys(c.cmon[ck]).length>MAX_CONT_MONTHS)f.push('Contingency beyond 10 months');
  if(c.dup[ck+'|'+r.weekEnding]>1)f.push('Duplicate entry (same centre and week)');
  return f;
}
function scope(){return S.block?REC.filter(function(r){return r.block===S.block}):REC}
function prep(){var all=scope(),c=buildCtx(all);all.forEach(function(r){r._f=flagsOf(r,c)});return all}
function byDate(a,b){return a.weekEnding<b.weekEnding?1:a.weekEnding>b.weekEnding?-1:(a.timestamp<b.timestamp?1:-1)}
function filt(all,base){
  var q=F.q.toLowerCase();
  return all.filter(function(r){
    if(F.block&&r.block!==F.block)return false;
    if(F.mode&&modeShort(r.mode)!==F.mode)return false;
    if(F.from&&r.weekEnding<F.from)return false;
    if(F.to&&r.weekEnding>F.to)return false;
    if(base)return true;
    if(F.status&&r.status!==F.status)return false;
    if(F.sample&&F.sample.indexOf(r.id)<0)return false;
    var ch=F.chip;
    if(ch==='flagged'&&!r._f.length)return false;
    if(ch==='ok'&&r._f.length)return false;
    if((ch==='Day Care'||ch==='BRR'||ch==='HBE')&&modeShort(r.mode)!==ch)return false;
    if(ch==='Pending'&&r.status!=='Pending')return false;
    if(ch==='Returned'&&r.status!=='Returned')return false;
    if(q&&(r.centre+' '+r.block+' '+r.therapist+' '+r.personName+' '+r.centreCode+' '+r.submittedBy).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
function zeroCentres(base){
  var seen={};base.forEach(function(r){seen[r.block+'|'+r.centre]=1});
  return CFG.centres.filter(function(c){return (!F.block||c.block===F.block)&&(!F.mode||modeShort(c.mode)===F.mode)&&!seen[c.block+'|'+c.name]});
}

function fsel(label,key,list,first){return '<div><label>'+label+'</label><select onchange="F.'+key+'=this.value;drawRes()">'+opts(list,F[key],first)+'</select></div>'}

  if(!S.block)h+=fsel('Block','block',CFG.blocks,'All blocks');
  h+=fsel('Mode','mode',['BRR','Day Care','HBE'],'All modes');

  h+='</div><div style="margin-top:6px"><button class="btn sm" onclick="setRange(\'7\')">Last 7 days</button><button class="btn sm" onclick="setRange(\'m\')">This month</button><button class="btn sm" onclick="setRange(\'30\')">Last 30 days</button><button class="btn sm" onclick="setRange(\'all\')">All time</button></div>';
  if(!o.nochips){h+='<div>';[['all','All'],['flagged','Flagged'],['ok','Compliant'],['Day Care','Day Care'],['BRR','BRR'],['HBE','HBE'],['Pending','Pending'],['Returned','Returned']].forEach(function(c){h+='<span class="chip'+(F.chip===c[0]?' on':'')+'" onclick="F.chip=\''+c[0]+'\';showTab(TAB)">'+c[1]+'</span>'});h+='</div>'}
  return h+'</div>';

function setRange(k){
  if(k==='7'){F.from=daysAgo(6);F.to=today()}else if(k==='30'){F.from=daysAgo(29);F.to=today()}else if(k==='m'){F.from=monthStart();F.to=today()}else{F.from='';F.to=''}
  $('f_from').value=F.from;$('f_to').value=F.to;drawRes();
}
function drawRes(){if(RESFN&&$('res'))$('res').innerHTML=RESFN()}
function flagHtml(r){return r._f.length?'<span class="bad">FLAG</span><br>'+r._f.map(esc).join('<br>'):'<span class="ok">COMPLIANT</span>'}
function photoCell(r){
  if(r.photoLinks.length)return r.photoLinks.map(function(u,i){return '<a href="'+esc(u)+'" target="_blank" rel="noopener">Photo '+(i+1)+'</a>'}).join(' ');
  if(r.localPhotos)return '<a href="#" onclick="showPh(\''+r.id+'\');return false">View ('+r.photoCount+')</a>';
  return r.photoCount?'('+r.photoCount+' photos)':'-';
}
function showPh(id){
  idbGet(id).then(function(l){
    var o=$('ov');o.style.display='block';
    o.innerHTML='<button class="btn o" onclick="$(\'ov\').style.display=\'none\'">Close</button>'+((l&&l.length)?l.map(function(p){return '<img src="'+p.data+'">'}).join(''):'<p>No photo images stored for this entry.</p>');

function actBtns(r){
  var h='';
  if(!canVerify()&&!isAdmin())return '';
  if(r._pending)return '<span class="note">Not uploaded yet</span>';
  if(r.status!=='Verified')h+='<button class="btn g sm" onclick="setSt(\''+r.id+'\',\'Verified\')">Verify</button> ';
  if(r.status!=='Returned')h+='<button class="btn o sm" onclick="setSt(\''+r.id+'\',\'Returned\')">Return</button> ';
  if(isAdmin())h+='<button class="btn o sm" onclick="delRec(\''+r.id+'\')">Delete</button>';
  return h;
}
function COLS(keys){
  var A={
    we:{h:'Week ending',f:function(r){return esc(r.weekEnding)}},
    blk:{h:'Block',f:function(r){return esc(r.block)}},
    mode:{h:'Mode',f:function(r){return modeShort(r.mode)}},
    ctr:{h:'Centre',f:function(r){return esc(r.centre)+(r.centreCode?' ('+esc(r.centreCode)+')':'')}},
    days:{h:'Days',f:function(r){return r.daysFunctioned}},
    cw:{h:'CWSN',f:function(r){return r.cwsn}},
    ther:{h:'Therapist',f:function(r){return r.therapist?esc(r.therapist)+(r.specialization?'<br><span class="note">'+esc(r.specialization)+'</span>':''):'-'}},
    sup:{h:'Present / officer',f:function(r){return esc(r.present.join(', '))+'<br>'+esc(r.personName)+' '+esc(r.phone)}},
    ses:{h:'Sessions',f:function(r){return r.sessions}},
    amt:{h:'Amount',f:function(r){return inr(r.totalHonorarium+r.contingency)}},
    aud:{h:'Audit status',f:flagHtml},
    st:{h:'Status',f:function(r){return esc(r.status)+(r.remark?'<br><span class="note">'+esc(r.remark)+'</span>':'')}},
    ph:{h:'Photos',f:photoCell},
    up:{h:'Upload',f:function(r){return r._pending?'<span class="bad">Waiting</span>':'Done'}},
    act:{h:'Action',a:1,f:actBtns}
  };
  return keys.map(function(k){return A[k]});
}
function grid(cs,rows){
  if(!rows.length)return '<p class="note">No entries found.</p>';
  var cap=300,shown=rows.slice(0,cap);
  var t='<div class="tbl-wrap scroll"><table class="tbl"><tr>'+cs.map(function(c){return '<th'+(c.a?' class="act"':'')+'>'+c.h+'</th>'}).join('')+'</tr>';
  shown.forEach(function(r){t+='<tr'+(r._f&&r._f.length?' class="flag"':'')+'>'+cs.map(function(c){return '<td'+(c.a?' class="act"':'')+'>'+c.f(r)+'</td>'}).join('')+'</tr>'});
  t+='</table></div><div class="cards">';
  shown.forEach(function(r){t+='<div class="card'+(r._f&&r._f.length?' flag':'')+'">'+cs.map(function(c){return '<div><b>'+c.h+':</b> '+c.f(r)+'</div>'}).join('')+'</div>'});

  return Object.keys(m).sort().map(function(k){var b=m[k];b.centres=Object.keys(b.cs).length;b.total=b.hon+b.cont;return b});
}
function totals(rows){var t={centres:0,entries:0,cwsn:0,ses:0,hon:0,cont:0,total:0,fl:0},cs={};rows.forEach(function(r){cs[r.block+'|'+r.centre]=1;t.entries++;t.cwsn+=r.cwsn;t.ses+=r.sessions;t.hon+=r.totalHonorarium;t.cont+=r.contingency;if(r._f.length)t.fl++});t.centres=Object.keys(cs).length;t.total=t.hon+t.cont;return t}

function importCentres(inp){
  var f=inp.files[0];if(!f)return;
  if(typeof XLSX==='undefined')return alert('Excel library could not load. Connect to the internet and reload.');
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var wb=XLSX.read(rd.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}),n=0;
      rows.forEach(function(r){
        var g=function(k){for(var x in r){if(x.trim().toLowerCase()===k)return String(r[x]).trim()}return ''};
        var b=g('block'),nm=g('centre')||g('center')||g('centre name')||g('name');if(!b||!nm)return;
        if(CFG.blocks.indexOf(b)<0)CFG.blocks.push(b);
        if(CFG.centres.some(function(x){return x.block===b&&x.name.toLowerCase()===nm.toLowerCase()}))return;
        CFG.centres.push({block:b,mode:normMode(g('mode')),name:nm,code:g('code')});n++;
      });
      saveCfg();pushCfg(n+' centres imported.').then(function(){showTab('setup')});
    }catch(e){alert('Could not read the file.')}
  };
  rd.readAsArrayBuffer(f);
}

function loadSample(){
  if(!confirm('Add sample centres and entries for testing?'))return;
  var bl=CFG.blocks.slice(0,4),nm={0:'BRR',1:'Day Care Centre',2:'HBE Cluster'},rnd=function(a,b){return a+Math.floor(Math.random()*(b-a+1))};
  bl.forEach(function(b,bi){MODES.forEach(function(m,mi){for(var k=1;k<=2;k++)CFG.centres.push({block:b,mode:m,name:b+' '+nm[mi]+' '+k,code:'G'+(bi+1)+(mi+1)+k})})});
  var t=new Date();
  for(var w=0;w<4;w++){CFG.centres.forEach(function(c){
    if(Math.random()<0.12)return;
    var dc=isDC(c.mode),days=dc?rnd(2,6):rnd(3,6),cw=dc?rnd(6,22):rnd(2,14),hr=rnd(6,15)*100,td=rnd(1,days),we=daysAgo(w*7+t.getDay()%7);
    var doms=DOMAINS.filter(function(){return Math.random()<0.6});if(!doms.length)doms=[DOMAINS[rnd(0,3)]];
    REC.push(norm({timestamp:new Date().toISOString(),id:uid(),weekEnding:we,block:c.block,mode:c.mode,centre:c.name,centreCode:c.code,operatingDays:DAYS.slice(0,days),daysFunctioned:days,present:[OFFICERS[rnd(0,3)]],personName:'Sample Person',phone:'9876543210',registerOk:Math.random()<0.9?'Yes':'No',iepOk:Math.random()<0.85?'Yes':'No',cwsn:cw,dailyMinMet:dc?(cw>=10?'Yes':'No'):'NA',preAssessment:'Yes',domains:doms,therapist:'Therapist '+rnd(1,9),specialization:doms[0],therapistDays:td,dailyHonorarium:hr,totalHonorarium:td*hr,contingency:dc?rnd(0,3)*100:0,sessions:rnd(4,25),photoLinks:[],photoCount:2,submittedBy:'Sample',status:Math.random()<0.5?'Verified':'Pending'}));
  })}
  saveCfg();saveRec();showTab('setup');flash('Sample data added. Open the Dashboard to see it.');
}

// ---------- HELP ----------
function viewHelp(){
  var h='<h2>Help</h2>';
  h+='<h3>Who can do what</h3><ul><li><b>All officials</b> (IE Official, BEEO, District Authority) can add entries and view the dashboard, centre activity, alerts, photos and reports for their block. The District Authority sees all blocks.</li><li><b>BEEO and District Authority</b> can Verify or Return entries.</li><li><b>District Authority only</b> can delete entries and change centres and settings.</li></ul>';
  h+='<h3>How to send your weekly entry</h3><ol><li>Open <b>New Entry</b>.</li><li>Choose the week ending date, block, mode and centre.</li><li>Tap the days, officials and therapy domains that apply.</li><li>Type only the numbers and names asked for.</li><li>Add 1 to 5 photos using the camera.</li><li>Tap <b>Submit Entry</b>.</li></ol><p>No internet? The entry is saved on your phone and uploads automatically when the internet returns. You can also tap <b>Send now</b> in the orange bar.</p><p>If the BEEO or district office returns your entry, open <b>My Entries</b>, read the reason, and submit a corrected entry.</p>';
  h+='<h3>Rules the app checks</h3><ul><li>Therapy cannot be recorded without a prior formal assessment (entry is blocked).</li><li>Daily honorarium cannot exceed Rs. 1,500. Contingency cannot exceed Rs. 500 per month (entry is blocked).</li><li>Day Care Centres must run at least 3 days a week and have at least 10 CWSN per day (entry is saved but flagged in red).</li><li>Missing IEP, missing attendance register, missing photos and duplicate entries are flagged.</li></ul>';
  if(S.role==='district')h+='<h3>Setting up for everyone (District Office)</h3><ol><li>Create the Google Sheet and add the Apps Script backend (file Code.gs) as described at its top.</li><li>Deploy it as a Web App and copy the URL.</li><li>Paste the URL into <b>DEFAULT_URL</b> near the top of this HTML file (or into Centres & Settings), then host the file (for example on GitHub Pages) and share the link on the WhatsApp groups.</li><li>On a phone: open the link, then use the browser menu and choose <b>Add to Home screen</b>.</li><li>Register blocks and centres under Centres & Settings.</li><li>Every Friday: open Higher Authority Report, choose the period, then download Excel or print as PDF.</li></ol>';
  return h;
}
